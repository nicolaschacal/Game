<style>
:root{color-scheme:dark;--ink:#211a20;--cream:#fff4dc;--gold:#f2b937;--night:#17152b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);font-family:'Zen Maru Gothic',sans-serif;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#17152b}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.14;mix-blend-mode:multiply}
.top{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{color:#fff4dc;font:900 14px 'DM Sans',sans-serif;letter-spacing:2px;text-shadow:0 2px 12px #17152b88}
.brand small{display:block;margin-top:4px;font:700 9px 'DM Sans',sans-serif;letter-spacing:1.7px;color:#fff4dcb0}
.pill{border:1px solid #fff4dc44;border-radius:999px;background:#17152b9c;color:#fff4dc;padding:7px 11px;font:800 10px 'DM Sans',sans-serif;letter-spacing:.8px;backdrop-filter:blur(12px)}
.editor{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);padding:12px;border:1px solid #fff4dc35;border-radius:20px;background:#17152be8;backdrop-filter:blur(16px);box-shadow:0 8px 32px #09081770;color:var(--cream)}

.materials{display:flex;gap:7px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}
.material{flex:1;min-width:57px;border:1px solid #fff4dc35;border-radius:12px;background:#ffffff0b;color:var(--cream);padding:8px 5px;font:800 10px 'DM Sans',sans-serif}
.material.active{border-color:#f2b937;background:#f2b93722;color:#ffd46b}
.material i{display:block;width:19px;height:19px;border-radius:6px;margin:0 auto 5px;border:1px solid #fff4dc50}
.special{width:100%;border:1px solid #E5B75B66;border-radius:12px;background:#F2B9371C;color:#FFD46B;padding:10px;font:900 10px 'DM Sans',sans-serif;letter-spacing:.8px}
.hint{margin-top:8px;color:#fff4dc99;text-align:center;font:700 8px 'DM Sans',sans-serif;letter-spacing:.8px}
#toast{position:absolute;z-index:8;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);border-radius:999px;background:#fff4dc;color:#2b2320;padding:7px 12px;font:900 9px 'DM Sans',sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
@media(min-width:700px){.editor{max-width:520px;left:50%;right:auto;width:calc(100% - 32px);transform:translateX(-50%);bottom:18px}.materials{justify-content:center}}
 .lane-controls{position:absolute;z-index:7;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 204px);display:flex;justify-content:space-between;pointer-events:none}.lane-controls button{pointer-events:auto;width:54px;height:54px;border:1px solid #fff4dc66;border-radius:50%;background:#17152bbd;color:#fff4dc;font-size:24px;font-weight:900;backdrop-filter:blur(10px)}#gameover{display:none;position:fixed;z-index:20;inset:0;background:#100e20dd;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff4dc}#gameover>div{max-width:320px;padding:28px 22px;border:1px solid #fff4dc44;border-radius:24px;background:#211d39}#gameover h2{font:900 25px 'DM Sans',sans-serif;margin:0 0 10px}#gameover p{color:#fff4dcaa;font-size:13px;line-height:1.5}#restart{border:0;border-radius:12px;background:#f2b937;color:#211a20;padding:13px 24px;font:900 12px 'DM Sans',sans-serif;margin-top:10px}
.top{align-items:center}
.stats{display:flex;gap:6px;pointer-events:none}
.pill b{color:#f2b937;margin-left:3px;font-size:12px}
.pill.bump{animation:bump .28s}
@keyframes bump{40%{transform:scale(1.28)}}
#progress{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 54px);left:14px;right:14px;height:7px;border-radius:99px;background:#17152b88;border:1px solid #fff4dc40;overflow:hidden;pointer-events:none}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2b937,#e8452c);border-radius:99px}
#combo{position:absolute;z-index:7;top:calc(env(safe-area-inset-top) + 70px);right:14px;color:#fff4dc;font:900 22px 'DM Sans',sans-serif;text-shadow:0 3px 0 #17152b;opacity:0;transition:opacity .2s;pointer-events:none}
#combo small{display:block;font-size:9px;letter-spacing:1px;text-align:right;color:#f2b937}
#toast{top:calc(env(safe-area-inset-top) + 74px);font-size:11px;padding:8px 14px;box-shadow:0 3px 0 #2b2320}
.pop{position:absolute;z-index:8;left:50%;top:52%;font:900 20px 'DM Sans',sans-serif;color:#fff4dc;text-shadow:0 2px 0 #17152b,0 0 10px #17152b66;white-space:nowrap;pointer-events:none;animation:pop .8s ease-out forwards}
.pop.gold{color:#ffd46b}.pop.big{font-size:30px;color:#fff;text-shadow:0 3px 0 #e8452c,0 6px 14px #17152b88}.pop.pink{color:#ffc4d6;font-size:24px}
@keyframes pop{0%{transform:translate(-50%,0) scale(.5);opacity:0}18%{transform:translate(-50%,-14px) scale(1.2);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}

.mat{height:66px;border:2.5px solid #2b1d16;border-radius:18px;background:#211d39e8;color:#fff4dc;font:900 13px 'DM Sans',sans-serif;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 5px 0 #0b0918;touch-action:none;transition:transform .1s}
.mat i{width:26px;height:26px;border-radius:8px;border:2.5px solid #fff4dc}

.mat.active i{border-color:#2b1d16}
.mat.call{animation:call .5s infinite alternate}
@keyframes call{to{box-shadow:0 5px 0 #0b0918,0 0 0 5px #f2b937;transform:scale(1.04)}}
#mute{position:absolute;z-index:7;left:14px;top:calc(env(safe-area-inset-top) + 70px);width:32px;height:32px;border-radius:50%;border:1px solid #fff4dc55;background:#17152b9c;color:#fff4dc;font-size:14px}
#gameover h2 em{font-style:normal;color:#f2b937}#gameover .nums{display:flex;justify-content:center;gap:18px;margin:14px 0 6px;font:900 22px 'DM Sans',sans-serif}#gameover .nums small{display:block;font-size:9px;letter-spacing:1px;color:#fff4dc99}
@media(min-width:700px){.bar{max-width:520px;left:50%;right:auto;width:calc(100% - 32px);transform:translateX(-50%)}}

<body>
<div id="stage"><div class="stage-ov"></div></div>
<div id="flash"></div>
<div class="top"><div class="brand">KANJŪ <small>TILE RUNNER · MAR</small></div><div class="stats"><div class="pill" id="scorePill">✦<b id="score">0</b></div><div class="pill" id="coinPill">◉<b id="coinsN">0</b></div></div></div>
<div id="progress"><i></i></div>
<button id="mute" aria-label="Sonido">♪</button>
<div id="combo">x2<small>RACHA</small></div>
<div id="toast">TILE COLOCADO</div>
<div id="gameover"><div><h2 id="goTitle">FIN DEL RECORRIDO</h2><p id="gameReason"></p><div class="nums"><div><span id="goScore">0</span><small>PUNTOS</small></div><div><span id="goCoins">0</span><small>MONEDAS</small></div><div><span id="goBest">0</span><small>RÉCORD</small></div></div><button id="restart">VOLVER A JUGAR</button></div></div>
<section class="bar">
 <div class="hint" id="hint">TOCÁ PARA EMPEZAR A CORRER</div>
 <button class="mat active" data-type="grass"><i style="background:#8DBF5E"></i>CAMINO</button>
 <button class="mat" data-type="water"><i style="background:#5AA5D2"></i>AGUA</button>
</section>
<script type="module">
import { mountScene, runnerLaneAtScreen, updateRunnerTile, runnerPulse } from './kanjuu-demo/scene3d.js';
import { HERO, BOAT, ROCK, STUMP, REEF, FIN, BARREL, COIN, PEARL, GATE } from './kanjuu-demo/runner-art.js';
const $=id=>document.getElementById(id);
const COLS=5,ROWS=240,START=ROWS-12;
// ── Nivel: tierra → muelle → puerto (barco) → mar → playa → tierra … → meta ──
// zone[y]: 'land' (se construye CAMINO), 'sea' (se construye AGUA), 'free' (ya está hecho: respiro para cambiar de tile)
const rnd=(()=>{let a=(Date.now()^0x9E3779B9)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
const pick=a=>a[Math.floor(rnd()*a.length)];
const tiles={},zone=new Array(ROWS).fill('free'),blockers=[],coins=[],boats=[],seas=[];
const paintRow=(y,g)=>{for(let x=0;x<COLS;x++)tiles[x+','+y]={g,h:0};};
for(let y=0;y<ROWS;y++)paintRow(y,'grass');
let cur=START-1,uid=0;
function fill(n,kind,{gap,lead,extra}){
 let safe=2;
 for(let i=0;i<n;i++){const y=cur-i;zone[y]=kind;paintRow(y,kind==='sea'?'deep':'empty');
  if(i>=lead&&(i-lead)%gap===0&&i<n-1){
   const prev=safe;safe=pick([-2,-1,1,2].map(d=>prev+d).filter(x=>x>=0&&x<COLS));
   const blocked=new Set([prev]);const pool=[0,1,2,3,4].filter(x=>x!==safe&&x!==prev);
   for(let k=0;k<extra&&pool.length>1;k++)blocked.add(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
   for(const x of blocked)blockers.push({id:'b'+uid++,kind:'paper',obstacle:'rock',sea:kind==='sea',svg:kind==='sea'?pick([REEF,FIN,BARREL]):pick([ROCK,STUMP]),x,y,w:1,h:1});
   coins.push({id:'c'+uid++,kind:'paper',svg:COIN,x:safe,y,w:.62,h:.62,value:10});
   if(pool.length&&rnd()<.4)coins.push({id:'c'+uid++,kind:'paper',svg:PEARL,x:pick(pool),y,w:.7,h:.7,value:50,pearl:true});
  }else if(i>1)coins.push({id:'c'+uid++,kind:'paper',svg:COIN,x:safe,y,w:.62,h:.62,value:10});
 }
 cur-=n;
}
const free=(n,g)=>{for(let i=0;i<n;i++){zone[cur-i]='free';paintRow(cur-i,g);}cur-=n;};
const SEAS=[14,20,26,30,34],LANDS=[12,10,10,10,10];
SEAS.forEach((len,i)=>{
 fill(LANDS[i],'land',{gap:4,lead:i?3:7,extra:i?1:0});
 free(2,'wood');
 const board=cur;free(2,'water');
 boats.push({id:'boat'+i,kind:'paper',svg:BOAT.idle[0],frames:BOAT,fps:5,x:1.7,y:board-.3,w:1.6,h:1.6});
 fill(len,'sea',{gap:i<2?3:2,lead:2,extra:i<1?1:2});
 const land=cur;free(3,'sand');
 seas.push({board,land,boat:'boat'+i});
});
free(6,'grass');const GOAL=cur+2;
const goal={id:'goal',kind:'paper',svg:GATE,x:1,y:GOAL-1,w:3,h:3};
const player={id:'kami',kind:'paper',svg:HERO.idle[0],frames:HERO,fps:9,x:2,y:START,w:1.15,h:1.15};
const path={[START]:{x:2,e:2,g:'grass',lanes:{2:'grass'}}};
let selected='grass';
const runner={playerId:player.id,startRow:START,lane:2,visualLane:2,speed:1.25,distance:0,steps:0,autoAdvance:true,started:false,obstacles:[],coins,path,buildRow:START-1,buildLane:2,lastBuildLane:2,boatId:null,onBoat:false,onCoin,onCoinMiss,onGameOver};
const opts={cols:COLS,rows:ROWS,tiles,items:[player,goal,...boats,...blockers,...coins],mode:'placing',preview:false,rain:false,tool:'move',paints:false,valid:null,selected:null,OBJS:{},runner,onTap:()=>{},onCell:()=>{},onMiss:()=>{},onTile:()=>{}};
const host=$('stage');
if(!mountScene(host,opts))document.body.innerHTML='<p style="color:white;padding:24px">Este dispositivo no pudo iniciar WebGL.</p>';
const toast=$('toast'),hint=$('hint'),gameover=$('gameover');

// ── Sonido, vibración y premios visuales ──
let ac=null,muted=false;try{muted=localStorage.getItem('kanjuu.runner.mute')==='1'}catch{}
const audio=()=>{if(muted)return null;try{ac??=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch{}return ac;};
function tone(f,d=.09,type='triangle',v=.05,to=0,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
function splash(){const a=audio();if(!a)return;const n=a.sampleRate*.45,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=1400;g.gain.value=.22;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start();}
const buzz=p=>{try{navigator.vibrate?.(p)}catch{}};
const setMuteIcon=()=>{$('mute').textContent=muted?'×':'♪';};setMuteIcon();
$('mute').addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('kanjuu.runner.mute',muted?'1':'0')}catch{}setMuteIcon();});
let toastTimer;
function showToast(msg){toast.textContent=msg;toast.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.opacity='0',1100);}
function pop(text,cls=''){const el=document.createElement('div');el.className='pop '+cls;el.textContent=text;el.style.left=(50+(Math.random()*24-12))+'%';el.style.top=(48+Math.random()*6)+'%';document.body.appendChild(el);setTimeout(()=>el.remove(),820);}
const bump=id=>{const el=$(id);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');};
let score=0,coinCount=0,streak=0,best=0;try{best=+localStorage.getItem('kanjuu.runner.best')||0}catch{}
const mult=()=>Math.min(5,1+Math.floor(streak/6));
function addScore(n){score+=n;$('score').textContent=score;}
function showCombo(){const c=$('combo');if(mult()>1){c.firstChild.textContent='x'+mult();c.style.opacity='1';}else c.style.opacity='0';}
function onCoin(id){const c=coins.find(x=>x.id===id);if(!c)return;const before=mult();streak++;const gain=c.value*mult();addScore(gain);coinCount++;$('coinsN').textContent=coinCount;bump('coinPill');
 if(c.pearl){pop('PERLA +'+gain,'pink');[784,988,1175,1568].forEach((f,i)=>tone(f,.12,'triangle',.05,0,i*.06));buzz([12,30,12]);runnerPulse('hop');}
 else{pop('+'+gain,'gold');tone(520*Math.pow(2,Math.min(streak,14)/12),.09,'square',.03);buzz(8);runnerPulse('squash');}
 if(mult()>before){pop('¡RACHA x'+mult()+'!','big');[660,880,1320].forEach((f,i)=>tone(f,.1,'triangle',.05,0,i*.07));}
 showCombo();}
function onCoinMiss(id){const c=coins.find(x=>x.id===id);if(c?.pearl)return;if(streak>=6)showToast('SE CORTÓ LA RACHA');streak=0;showCombo();}

// ── Fin de partida ──
let lastWrong=-99;
function endGame(title,reason,win=false){if(gameover.style.display==='flex')return;runner.gameOver=true;runner.hitPause=999;
 const record=score>best;if(record){best=score;try{localStorage.setItem('kanjuu.runner.best',best)}catch{}}
 $('goTitle').innerHTML=win?'¡LLEGASTE AL <em>SANTUARIO</em>!':title;$('gameReason').textContent=reason+(record&&score>0?' ¡Nuevo récord!':'');
 $('goScore').textContent=score;$('goCoins').textContent=coinCount;$('goBest').textContent=best;
 if(win){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,'triangle',.06,0,i*.11));buzz([20,40,20,40,60]);}else{tone(330,.35,'sawtooth',.05,90);buzz(120);}
 setTimeout(()=>gameover.style.display='flex',win?500:350);}
function onGameOver(reason){
 const y=targetRow(),sea=zone[y]==='sea'||runner.onBoat;
 if(lastWrong>=y-1&&lastWrong<=y+2)endGame(sea?'EL BARCO ENCALLÓ':'SIN CAMINO',sea?'En el mar la ruta se construye con AGUA. Cambiá de tile cuando subas al barco.':'En tierra la ruta se construye con CAMINO. Cambiá de tile al llegar a la playa.');
 else if(runner.blockedByRock!=null&&runner.blockedByRock>=y)endGame(sea?'¡CHOQUE!':'¡TROPEZÓN!',sea?'El barco no puede pasar por encima de un obstáculo. Arrastrá hacia un costado.':'Kami no puede pasar por encima de un obstáculo. Arrastrá hacia un costado.');
 else endGame(sea?'EL MAR SE ACABÓ':'SE ACABÓ EL CAMINO','No quedó lugar para seguir avanzando.');
}

// ── Construcción libre en la cuadrícula ──
// · la fila objetivo es siempre la siguiente (un tile por delante);
// · su primer tile entra ADELANTE o en DIAGONAL; mientras no se llegue a su centro se extiende a IZQUIERDA o DERECHA;
// · no se construye sobre obstáculos ni hacia atrás; en el mar solo sirve AGUA y en tierra solo CAMINO.
const clampLane=l=>Math.max(0,Math.min(COLS-1,Math.round(l)));
const blockSet=new Set(blockers.map(b=>b.x+','+b.y));
const isRockCell=(x,y)=>blockSet.has(x+','+y);
const targetRow=()=>Math.ceil(START-runner.distance)-1;
const prevExit=y=>runner.path[y+1]?.x??runner.lastBuildLane;
let wrongAt=0;
function materialOk(y){
 const z=zone[y];if(z==='free')return true;
 const ok=z==='sea'?selected==='water':selected!=='water';
 if(!ok){lastWrong=y;const now=performance.now();if(now-wrongAt>500){wrongAt=now;showToast(z==='sea'?'¡EN EL MAR SE CONSTRUYE CON AGUA!':'¡EN TIERRA SE CONSTRUYE CON CAMINO!');tone(160,.12,'sawtooth',.04);buzz(40);}}
 return ok;
}
function setTile(x,y){if(zone[y]==='free')return;const tile={g:selected,h:0};tiles[x+','+y]=tile;updateRunnerTile(x,y,tile);addScore(1);tone(selected==='water'?300:210,.04,'sine',.025);}
function buildToward(lane){
 if(runner.gameOver)return false;
 const y=targetRow();if(y<0)return false;
 runner.buildRow=y;
 lane=clampLane(lane??runner.buildLane);
 const row=runner.path[y];
 if(!row){
  if(!materialOk(y))return false;
  const from=prevExit(y);
  let x=Math.abs(lane-from)>1?from+Math.sign(lane-from):lane;
  if(isRockCell(x,y)){
   if(x!==from&&!isRockCell(from,y))x=from;
   else{runner.blockedByRock=y;return false;}
  }
  setTile(x,y);runner.path[y]={x,e:x,g:selected,lanes:{[x]:selected}};
  runner.lastBuildLane=x;runner.steps++;
  return true;
 }
 if(lane===row.x)return false;
 const nx=row.x+Math.sign(lane-row.x);
 if(isRockCell(nx,y))return false;
 if(!(nx in row.lanes)){if(!materialOk(y))return false;setTile(nx,y);row.lanes[nx]=selected;runner.steps++;}
 row.x=nx;runner.lastBuildLane=nx;
 return true;
}
function refreshHints(){
 const y=targetRow();if(y<0||runner.gameOver||zone[y]==='free'){runner.hints=[];return;}
 runner.hintColor=zone[y]==='sea'?'#FFFFFF':'#F2B937';
 const row=runner.path[y],want=clampLane(runner.buildLane??runner.lastBuildLane),out=[];
 if(!row){const from=prevExit(y);for(const x of [from-1,from,from+1])if(x>=0&&x<COLS&&!isRockCell(x,y))out.push({x,y,main:x===(Math.abs(want-from)>1?from+Math.sign(want-from):want)});}
 else for(const x of [row.x-1,row.x+1])if(x>=0&&x<COLS&&!isRockCell(x,y))out.push({x,y,main:buildHeld&&want!==row.x&&Math.sign(want-row.x)===Math.sign(x-row.x)});
 runner.hints=out;
}
function laneFromPointer(e){const lane=runnerLaneAtScreen(e.clientX,e.clientY);if(lane!==null)runner.buildLane=lane;}
function selectMaterial(type){if(selected===type)return;selected=type;document.querySelectorAll('.mat').forEach(b=>{b.classList.toggle('active',b.dataset.type===type);b.classList.remove('call');});tone(type==='water'?520:392,.07,'triangle',.05);buzz(10);}
document.querySelectorAll('.mat').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();audio();selectMaterial(b.dataset.type);}));
$('restart').addEventListener('click',()=>location.reload());

// ── Eventos al entrar a cada fila ──
let lastRow=START,seaIndex=0;
function enterRow(r){
 addScore(1);
 const sea=seas[seaIndex];
 if(sea&&r===sea.board){runner.boatId=sea.boat;runner.onBoat=true;splash();buzz([15,40,25]);pop('¡A NAVEGAR!','big');$('flash').style.opacity='.5';setTimeout(()=>$('flash').style.opacity='0',120);runnerPulse('hop');}
 if(sea&&r===sea.land+1){runner.onBoat=false;runner.leaveBoat=sea.boat;seaIndex++;const bonus=200*seaIndex;addScore(bonus);bump('scorePill');pop('¡TIERRA! +'+bonus,'big');[523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.06,0,i*.08));buzz([20,30,20,30,40]);runnerPulse('hop');}
 // roce: pasar pegado a un obstáculo
 const row=runner.path[r];if(row&&zone[r]!=='free'){const ls=Object.keys(row.lanes).map(Number);if(ls.some(x=>isRockCell(x-1,r)||isRockCell(x+1,r))){addScore(5*mult());pop('¡CASI! +'+5*mult());tone(880,.05,'sine',.03);}}
 const prog=(START-r)/(START-GOAL);$('progress').firstElementChild.style.width=Math.min(100,prog*100)+'%';
 runner.speed=(1.25+Math.min(1,prog)*.95)*(runner.onBoat?1.18:1);
 if(r<=GOAL){addScore(500);endGame('', 'Cruzaste los cinco mares.',true);}
}
function refreshUI(){
 const y=targetRow(),sea=seas[seaIndex];
 const toBoard=sea&&!runner.onBoat?y-sea.board:99;
 // próximo tramo que hay que construir: decide qué botón llama la atención
 let nz=null;for(let q=y;q>y-7&&q>=0;q--)if(zone[q]!=='free'){nz=zone[q];break;}
 const callWater=nz==='sea'&&selected!=='water',callLand=nz==='land'&&selected==='water';
 document.querySelector('.mat[data-type=water]').classList.toggle('call',!!callWater);
 document.querySelector('.mat[data-type=grass]').classList.toggle('call',!!callLand);
 hint.textContent=!runner.started?'TOCÁ PARA EMPEZAR A CORRER':callWater?'¡UN BARCO! CAMBIÁ A AGUA PARA TRAZAR TU RUTA':callLand?'¡TIERRA A LA VISTA! CAMBIÁ A CAMINO':runner.onBoat?'ARRASTRÁ PARA ESQUIVAR · EL MAR SE HACE CON AGUA':sea&&toBoard<12?'BARCO ADELANTE · PREPARATE':'TOCÁ O ARRASTRÁ PARA CAMBIAR DE CARRIL';
}

// ── Entrada: un dedo. Mantener = construir adelante; arrastrar = costados / diagonal ──
let buildHeld=false,keyHeld=false,lateralClock=0,lastFrame=performance.now();
host.addEventListener('pointerdown',e=>{if(runner.gameOver)return;audio();runner.started=true;buildHeld=true;lateralClock=0;laneFromPointer(e);buildToward(runner.buildLane);try{host.setPointerCapture(e.pointerId);}catch{}e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointermove',e=>{if(!buildHeld)return;laneFromPointer(e);e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointerup',e=>{buildHeld=false;e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointercancel',()=>{buildHeld=false;},true);
// Teclado (escritorio): ↑/W mantener = avanzar · ←/→ = lateral o diagonal · Q/E = diagonal · espacio = cambiar tile
window.addEventListener('keydown',e=>{
 if(runner.gameOver)return;const k=e.key.toLowerCase();
 if(k===' '){e.preventDefault();if(!e.repeat)selectMaterial(selected==='water'?'grass':'water');return;}
 if(['arrowup','w','arrowleft','a','arrowright','d','q','e'].includes(k))e.preventDefault();else return;
 audio();runner.started=true;
 if(k==='arrowup'||k==='w'){keyHeld=true;if(!e.repeat){const y=targetRow(),row=runner.path[y];runner.buildLane=row?row.x:prevExit(y);if(!row)buildToward(runner.buildLane);}return;}
 if(e.repeat)return;
 const y=targetRow(),row=runner.path[y],base=row?row.x:prevExit(y);
 if(k==='q'||k==='e'){if(!row){runner.buildLane=base+(k==='q'?-1:1);buildToward(runner.buildLane);}return;}
 runner.buildLane=clampLane(base+(k==='arrowleft'||k==='a'?-1:1));buildToward(runner.buildLane);
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keyHeld=false;});
function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;
 const y=targetRow();runner.buildRow=y;
 if(!runner.gameOver&&y>=0&&runner.started){
  // tramos ya hechos (muelle, puerto, playa): el camino sigue solo, así el pulgar queda libre para cambiar de tile
  // El camino avanza solo hacia adelante: no hace falta mantener nada apretado.
  // Solo se pierde por no esquivar un obstáculo o por no cambiar de tile a tiempo.
  if(!runner.path[y])buildToward(buildHeld?runner.buildLane:prevExit(y));
  if(buildHeld){
   if(runner.path[y]&&clampLane(runner.buildLane)!==runner.path[y].x){lateralClock-=dt;if(lateralClock<=0){lateralClock=.07;buildToward(runner.buildLane);}}
  }
  const r=Math.ceil(START-runner.distance);while(lastRow>r){lastRow--;enterRow(lastRow);if(runner.gameOver)break;}
 }
 refreshHints();if(!runner.gameOver)refreshUI();
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
if(new URLSearchParams(location.search).has('debug'))window.__dbg={runner,zone,seas,blockers,coins,get score(){return score},select:selectMaterial,GOAL,START};
</script>
</body></html>
