<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1B1730">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KANJŪ RUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js"}}</script>
<style>
/* GUI de papel recortado: piezas crema, borde de tinta grueso, sombra dura, botones con volumen */
:root{color-scheme:dark;--ink:#1B1730;--cream:#FFF4DC;--paper:#F1E3C2;--gold:#F2B937;--goldD:#C98A1E;--red:#E8452C;--redD:#A92E1B;--green:#5DB84F;--greenD:#3A8A30;--mute:#8a8069;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Nunito,system-ui,sans-serif;color:var(--cream);touch-action:none}
button{font:inherit;color:inherit;padding:0;margin:0;cursor:pointer}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.14;mix-blend-mode:multiply}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 55%,#0000 55%,#1b173066 100%)}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:#bfe8ff;opacity:0;transition:opacity .35s}
.L{font-family:'Lilita One',Nunito,sans-serif;font-weight:400}
.out{text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink)}
svg.ico{display:block}
/* piezas */
.chip{position:absolute;height:38px;padding:0 14px 0 40px;border-radius:99px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink);font:400 19px/32px 'Lilita One',sans-serif;display:flex;align-items:center}
.chip svg{position:absolute;left:-8px;top:-9px;width:50px;height:50px}
.chip.bump{animation:bump .28s}@keyframes bump{40%{transform:scale(1.22)}}
.round{position:absolute;width:42px;height:42px;border-radius:14px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink);font:400 20px/34px 'Lilita One',sans-serif;text-align:center}
.round:active,.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:66px;border-radius:20px;border:3.5px solid var(--ink);background:linear-gradient(#FFD46B 0 46%,var(--gold) 46%);box-shadow:0 7px 0 var(--goldD),0 7px 0 3.5px var(--ink),0 14px 18px #0006;color:var(--ink);font:400 27px 'Lilita One',sans-serif;letter-spacing:1.5px;transition:transform .06s,box-shadow .06s}
.btn:before{content:"";position:absolute;left:10px;right:10px;top:5px;height:9px;border-radius:9px;background:#fff7}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--goldD),0 2px 0 3.5px var(--ink)}
.btn.green{background:linear-gradient(#86D66F 0 46%,var(--green) 46%);box-shadow:0 7px 0 var(--greenD),0 7px 0 3.5px var(--ink),0 14px 18px #0006;color:#fff;text-shadow:0 2px 0 var(--greenD)}
.btn.green:active{box-shadow:0 2px 0 var(--greenD),0 2px 0 3.5px var(--ink)}
.btn.sm{height:50px;font-size:18px;border-radius:16px}
.btn.plain{background:var(--cream);box-shadow:0 5px 0 #CDBE9A,0 5px 0 3.5px var(--ink)}.btn.plain:before{display:none}
.btn.locked{background:linear-gradient(#fff 0 46%,var(--cream) 46%);font-size:21px}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ribbon{position:absolute;left:50%;transform:translateX(-50%);padding:6px 26px 7px;background:var(--red);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);font:400 20px 'Lilita One',sans-serif;letter-spacing:1px;color:var(--cream);white-space:nowrap;text-align:center}
.ribbon small{display:block;font:900 9px Nunito;letter-spacing:1.5px;color:#ffe3b0;margin-top:-1px}
.bar{height:9px;border-radius:9px;background:#fff4dc26;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),#FFD46B);transition:width .4s}
/* HUD de carrera */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .25s}
body.home #hud{opacity:0}
#progress{position:absolute;left:18px;right:18px;top:calc(var(--st) + 18px);height:12px;border-radius:9px;background:#1B1730B0;border:2.5px solid var(--ink)}
#progress i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--red))}
#progress svg{position:absolute;top:-13px;width:30px;height:30px;margin-left:-15px}
#score{position:absolute;left:18px;top:calc(var(--st) + 46px);font-size:44px;line-height:44px;color:var(--cream);transform-origin:left center}
#score.bump{animation:bump .28s}
#combo{position:absolute;left:20px;top:calc(var(--st) + 96px);padding:2px 10px 3px;border-radius:9px;background:var(--red);border:3px solid var(--ink);font:400 17px 'Lilita One',sans-serif;transform:rotate(-5deg);box-shadow:0 3px 0 var(--ink);opacity:0;transition:opacity .2s}
#coinPill{right:16px;top:calc(var(--st) + 46px)}
#pause{right:16px;top:calc(var(--st) + 98px);border-radius:50%;pointer-events:auto}
#boosts{position:absolute;left:16px;top:calc(var(--st) + 140px);display:flex;flex-direction:column;gap:9px}
.pw{width:48px;height:48px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);position:relative}
.pw span{position:absolute;inset:4px;border-radius:50%;background:var(--cream);color:var(--ink);font:400 18px/34px 'Lilita One',sans-serif;text-align:center}
#hint{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 18px);text-align:center;font:900 10px Nunito;letter-spacing:1.2px;color:#fff4dcd9;text-shadow:0 1px 5px var(--ink)}
#toast{position:fixed;z-index:9;left:50%;top:calc(var(--st) + 150px);transform:translateX(-50%);padding:8px 16px;border-radius:12px;background:var(--ink);border:2.5px solid var(--cream);font:900 11px Nunito;letter-spacing:1px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.pop{position:fixed;z-index:8;left:50%;top:50%;font:400 26px 'Lilita One',sans-serif;color:var(--cream);white-space:nowrap;pointer-events:none;animation:pop .85s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink)}
.pop.gold{color:#FFD46B}.pop.pink{color:#FFC4D6;font-size:30px}.pop.big{font-size:40px;color:var(--gold)}
@keyframes pop{0%{transform:translate(-50%,0) scale(.4) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-16px) scale(1.25) rotate(-5deg);opacity:1}30%{transform:translate(-50%,-22px) scale(1) rotate(-5deg)}100%{transform:translate(-50%,-96px) scale(1) rotate(-5deg);opacity:0}}
#banner{position:fixed;z-index:9;top:calc(var(--st) + 190px);opacity:0;pointer-events:none;font-size:24px;padding:8px 30px 9px}
#banner.show{animation:banner 2.2s ease both}@keyframes banner{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
/* Inicio */
#menu{position:fixed;inset:0;z-index:30;display:none}
#menu:before{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(#1b173000,#1b1730cc 70%);pointer-events:none}
#mute{left:16px;top:calc(var(--st) + 16px)}
#walletChip{right:16px;top:calc(var(--st) + 16px)}
.logo{position:absolute;left:0;right:0;top:calc(var(--st) + 84px);text-align:center;transform:rotate(-3deg);pointer-events:none;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-3deg) translateY(-6px)}}
.logo b{display:block;font:400 62px/56px 'Lilita One',sans-serif;color:var(--cream);letter-spacing:2px;text-shadow:0 5px 0 var(--red),0 9px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 9px 0 var(--ink),-3px 9px 0 var(--ink)}
.logo b+b{color:var(--gold);font-size:74px;line-height:70px}
.logo .u{position:relative}.logo .u:before{content:'';position:absolute;left:5px;right:5px;top:-6px;height:9px;border-radius:5px;background:var(--cream);box-shadow:0 0 0 3px var(--ink)}
.seal{position:absolute;left:50%;margin-left:64px;top:66px;width:46px;height:46px;border-radius:10px;background:var(--red);border:3px solid var(--ink);color:var(--cream);font:400 27px/40px 'Yuji Syuku',serif;transform:rotate(9deg);box-shadow:0 3px 0 var(--ink)}
.arrow{position:absolute;bottom:calc(var(--sb) + 252px);width:46px;height:46px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink);font:400 26px/36px 'Lilita One',sans-serif;text-align:center}
#prevSkin{left:30px}#nextSkin{right:30px}
#skinName{bottom:calc(var(--sb) + 182px)}
#mission{position:absolute;left:18px;right:18px;bottom:calc(var(--sb) + 108px);padding:9px 12px 10px 54px;border-radius:16px;background:#1B1730E6;border:3px solid var(--ink);box-shadow:0 0 0 2px #fff4dc30 inset;text-align:left}
#mission svg{position:absolute;left:6px;top:5px;width:42px;height:42px}#mission b{font:900 12px Nunito;letter-spacing:.3px}#mission em{float:right;font:400 14px 'Lilita One',sans-serif;color:var(--gold);font-style:normal}
#mission.done{box-shadow:0 0 0 2px var(--green) inset}#mission.done em{color:#86D66F}
#playWrap{position:absolute;left:18px;right:18px;bottom:calc(var(--sb) + 26px)}
#nav{position:fixed;z-index:33;left:0;right:0;bottom:0;height:calc(var(--sb) + 76px);padding-bottom:var(--sb);background:var(--cream);border-top:3.5px solid var(--ink);display:none}
#nav button{flex:1;background:none;border:0;text-align:center;padding-top:8px;color:#7c7460;font:900 10px Nunito;letter-spacing:.8px;position:relative}
#nav button i{display:block;font:400 25px/28px 'Lilita One',sans-serif;font-style:normal;color:#a39a82}
#nav button.on{color:var(--ink)}#nav button.on i{color:var(--red)}#nav button.on:before{content:"";position:absolute;left:22%;right:22%;top:-3.5px;height:6px;border-radius:0 0 6px 6px;background:var(--red)}
#nav .dot{position:absolute;top:5px;left:50%;margin-left:12px;width:17px;height:17px;border-radius:50%;background:var(--red);border:2.5px solid var(--ink);color:#fff;font:900 9px/12px Nunito;display:none}
/* Botones alrededor del inicio (sin barra inferior: el juego es el protagonista) */
.side{position:absolute;top:calc(var(--st) + 250px);width:66px;padding:8px 0 7px;border-radius:18px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:var(--ink);font:900 9px Nunito;letter-spacing:.8px;text-align:center}
.side i{display:block;font:400 26px/28px 'Lilita One',sans-serif;font-style:normal;color:var(--red)}
.side:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.side .dot{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--red);border:2.5px solid var(--ink);color:#fff;font:900 10px/15px Nunito;display:none}
#worldChip{top:calc(var(--st) + 236px);background:var(--ink);border-color:var(--cream);box-shadow:0 4px 0 #0008;font-size:14px;padding:5px 18px 6px}
#worldChip small{display:inline;margin-left:6px;color:var(--gold);font:900 9px Nunito}
.close{position:absolute;right:16px;top:calc(var(--st) + 14px);width:38px;height:38px;border-radius:50%;line-height:30px;font-size:17px;z-index:3}
.head .chip{right:66px}
#play:after{content:"";position:absolute;top:0;bottom:0;width:46px;left:-60px;background:linear-gradient(100deg,#fff0,#fff9,#fff0);transform:skewX(-18deg);animation:shine 2.8s ease-in-out infinite}
#play{overflow:hidden}@keyframes shine{0%,55%{left:-60px}100%{left:110%}}
/* Jugo: líneas de velocidad, chispas, moneda que vuela al contador, sacudida, papel picado, pantalla de carga */
#speed{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s;background:repeating-conic-gradient(from 0deg at 50% 46%,#fff0 0 5.2deg,#ffffff2e 5.6deg 6deg,#fff0 6.4deg 11deg);-webkit-mask:radial-gradient(ellipse at 50% 46%,#0000 38%,#000 85%);mask:radial-gradient(ellipse at 50% 46%,#0000 38%,#000 85%);animation:spin 1.2s steps(6) infinite}
@keyframes spin{to{transform:rotate(11deg) scale(1.06)}}
.spark{position:fixed;z-index:8;width:9px;height:9px;border-radius:2px;background:#FFD46B;border:2px solid var(--ink);pointer-events:none}
.fly{position:fixed;z-index:9;width:34px;height:34px;pointer-events:none}
.quake{animation:quake .45s}@keyframes quake{10%{transform:translate(-9px,5px) rotate(-.6deg)}30%{transform:translate(8px,-6px) rotate(.5deg)}50%{transform:translate(-6px,4px)}70%{transform:translate(4px,-3px)}90%{transform:translate(-2px,1px)}}
.bit{position:fixed;z-index:27;top:-20px;width:11px;height:15px;border:2px solid var(--ink);border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#splash{position:fixed;inset:0;z-index:60;background:var(--ink);transition:opacity .5s;display:flex;align-items:center;justify-content:center}
#splash .logo{position:relative;top:auto;left:auto;right:auto;margin-top:-40px}
#splash .load{position:absolute;left:25%;right:25%;top:62%;height:12px;border-radius:9px;border:2.5px solid var(--cream);overflow:hidden}#splash .load i{display:block;height:100%;width:30%;background:var(--gold);animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{margin-left:70%}}
/* Clima del mundo: viento de arena, nieve, pétalos, hojas */
#wx{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#wx.sand{background:linear-gradient(#e8d29a40,#e8d29a14 45%,#e8d29a30)}
.gust{position:absolute;left:-60%;width:60%;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff0,#f6e7bdd0 40%,#fff0);animation:gust linear infinite}
@keyframes gust{to{transform:translateX(280vw) translateY(-30px)}}
.wxp{position:absolute;top:-24px;animation:wxfall linear infinite}
@keyframes wxfall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--sway),55vh) rotate(180deg)}100%{transform:translate(calc(var(--sway)*-.4),112vh) rotate(360deg)}}
.wxp.rise{top:auto;bottom:-24px;animation-name:wxrise}@keyframes wxrise{0%{transform:translate(0,0)}50%{transform:translate(var(--sway),-55vh) rotate(40deg)}100%{transform:translate(calc(var(--sway)*-.4),-112vh) rotate(-30deg)}}
.wxp.grain{top:auto;left:-12px;animation-name:grain}@keyframes grain{to{transform:translate(115vw,var(--sway)) rotate(300deg)}}
/* Paneles: tienda y récords */
.panel{position:fixed;inset:0;z-index:31;display:none;background:var(--paper);color:var(--ink);overflow-y:auto;touch-action:pan-y;padding-bottom:calc(var(--sb) + 30px);animation:panelIn .28s cubic-bezier(.2,1,.3,1)}
@keyframes panelIn{0%{transform:translateY(40px);opacity:0}}
.head{position:sticky;top:0;z-index:2;height:calc(var(--st) + 84px);background:var(--red);border-bottom:3.5px solid var(--ink)}
.head h2{margin:0;position:absolute;left:18px;bottom:12px;font:400 30px 'Lilita One',sans-serif;color:var(--cream);text-shadow:0 3px 0 var(--ink)}
.head .chip{right:66px;bottom:14px}
.tabs{display:flex;gap:8px;padding:14px 14px 4px}.tabs button{flex:1;height:40px;border-radius:14px;border:3px solid var(--ink);background:#EADBB8;color:#7c7460;font:400 15px 'Lilita One',sans-serif}.tabs .on{background:var(--ink);color:var(--cream)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px}
.sk{position:relative;border-radius:20px;border:3.5px solid var(--ink);box-shadow:0 6px 0 var(--ink);padding:8px 8px 10px;text-align:center;color:var(--ink);background:var(--cream)}
.sk:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.sk.on{background:#FFF9E8;box-shadow:0 6px 0 var(--ink),0 0 0 4px var(--gold)}
.sk .art{height:112px;border-radius:14px;background:radial-gradient(circle at 50% 60%,#fff 0,var(--bg) 70%);border:2.5px solid var(--ink);margin-bottom:6px;overflow:hidden}
.sk .art svg{width:112px;height:112px}.sk.locked .art svg{filter:saturate(.75)}
.sk b{display:block;font:400 18px 'Lilita One',sans-serif}.sk small{display:block;font:900 8.5px Nunito;letter-spacing:1.4px;color:var(--rc);margin-bottom:7px}
.price{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:99px;border:2.5px solid var(--ink);background:var(--gold);font:400 15px 'Lilita One',sans-serif;box-shadow:0 3px 0 var(--ink);color:var(--ink)}.price.use{background:var(--green);color:#fff}.price.own{background:#EADBB8}
.tag{position:absolute;left:-3.5px;top:10px;padding:2px 8px 2px 10px;background:var(--rc);color:#fff;font:900 8px Nunito;letter-spacing:1px;border:2.5px solid var(--ink);border-left:0;border-radius:0 8px 8px 0}
.it{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border-radius:18px;border:3.5px solid var(--ink);background:var(--cream);box-shadow:0 5px 0 var(--ink);padding:10px 12px;color:var(--ink);grid-column:1/3}
.it:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.it i{flex:0 0 48px;height:48px;border-radius:50%;border:3px solid var(--ink);font:400 21px/42px 'Lilita One',sans-serif;font-style:normal;color:#fff;text-align:center}
.it b{display:block;font:400 18px 'Lilita One',sans-serif}.it small{font:700 11px Nunito;color:var(--mute)}.it u{text-decoration:none;font:900 10px Nunito;background:var(--green);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.it .price{margin-left:auto;flex:none}
.note{padding:4px 18px 0;font:700 11px Nunito;color:var(--mute)}
.top5{padding:14px}.top5 div{display:flex;align-items:center;gap:12px;border-radius:16px;border:3px solid var(--ink);background:var(--cream);box-shadow:0 4px 0 var(--ink);padding:10px 14px;margin-bottom:12px;font:400 24px 'Lilita One',sans-serif}
.top5 i{flex:0 0 36px;height:36px;border-radius:50%;background:var(--ink);color:var(--cream);font:400 17px/36px 'Lilita One',sans-serif;font-style:normal;text-align:center}.top5 div:first-child i{background:var(--gold);color:var(--ink)}
.top5 small{margin-left:auto;font:900 10px Nunito;letter-spacing:1px;color:var(--mute);text-align:right}
/* Tarjetas: caída, revivir, pausa */
.dim{position:fixed;inset:0;z-index:28;display:none;align-items:center;justify-content:center;background:#1B1730B8}
.card{position:relative;width:min(88%,350px);border-radius:26px;background:var(--cream);border:3.5px solid var(--ink);box-shadow:0 8px 0 var(--ink),0 22px 30px #0007;color:var(--ink);padding:40px 18px 20px;text-align:center;animation:cardIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{0%{transform:scale(.7) translateY(30px);opacity:0}}
.card .ribbon{top:-22px}
.card .lbl{font:900 10px Nunito;letter-spacing:1.6px;color:var(--mute)}.card .big{font:400 58px/56px 'Lilita One',sans-serif}
.card p{margin:4px 0 12px;font:700 12.5px Nunito;color:#5d5546;line-height:1.35}
.rec{display:none;margin-top:6px;padding:3px 12px;border-radius:99px;background:var(--gold);border:2.5px solid var(--ink);font:900 10px Nunito;letter-spacing:1px}
.stats{display:flex;gap:8px;margin:14px 0 4px}.stats div{flex:1;border-radius:14px;background:var(--paper);border:2.5px solid var(--ink);padding:7px 4px 6px;font:400 20px 'Lilita One',sans-serif}.stats small{display:block;font:900 8.5px Nunito;letter-spacing:1px;color:var(--mute)}
.nudge{margin-top:14px;padding:8px 10px 9px 58px;border-radius:14px;background:var(--ink);color:var(--cream);text-align:left;position:relative;font:900 11px Nunito;display:none}.nudge svg{position:absolute;left:4px;top:-12px;width:54px;height:54px}
.row2{display:flex;gap:10px;margin-top:16px}.row2 .btn{flex:1}.row2 .btn+.btn{flex:1.6}
#rvBtn .ring{position:absolute;right:12px;top:8px;width:44px;height:44px;border-radius:50%;background:#ffffff40;overflow:hidden}

<script type="module">
import { mountScene, runnerLaneAtScreen, updateRunnerTile, runnerPulse, runnerStats, runnerHideItems, moverLane, setGroundColor, setHour } from './kanjuu-demo/scene3d.js';
import { BOAT, BALLOON, TRAIN, ROCK, STUMP, REEF, FIN, BARREL, COIN, PEARL, GATE, PEAK, CLOUD, STORM, STAR, BARRIER, CRATE, GEM, CART, SKINS, artFor } from './kanjuu-demo/runner-art.js';
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search),DEBUG=Q.has('debug'),QUICK=Q.has('quick');

// ── Guardado: monedero, personajes, récord (queda en el dispositivo) ──
const store={get(k,d){try{const v=localStorage.getItem('kanjuu.run.'+k);return v==null?d:JSON.parse(v);}catch{return d;}},set(k,v){try{localStorage.setItem('kanjuu.run.'+k,JSON.stringify(v));}catch{}}};
let wallet=store.get('wallet',0),owned=store.get('owned',['kami']),skinId=store.get('skin','kami'),best=store.get('best',0),muted=store.get('mute',false);
if(!owned.includes(skinId))skinId='kami';
// Ítems consumibles: se compran con monedas. Revivir se usa al perder; los demás se gastan al empezar la próxima partida.
const ITEMS=[
 {id:'revive',name:'Revivir',icon:'♥',price:120,tag:'Seguís donde caíste'},
 {id:'shield',name:'Escudo',icon:'◈',price:80,tag:'Te salva de un choque'},
 {id:'magnet',name:'Imán',icon:'∩',price:60,tag:'Atrae monedas vecinas'},
 {id:'double',name:'Doble',icon:'x2',price:100,tag:'Monedas x2'},
];
const stock={revive:0,shield:0,magnet:0,double:0,...store.get('items',{})};
// Lo que se arrastra de un mundo al siguiente dentro de la misma partida
let carry=null,autostart=false;
try{carry=JSON.parse(sessionStorage.getItem('kanjuu.run.carry')||'null');sessionStorage.removeItem('kanjuu.run.carry');autostart=sessionStorage.getItem('kanjuu.run.auto')==='1';sessionStorage.removeItem('kanjuu.run.auto');}catch{}
const stage=carry?.stage??store.get('world',0); // se retoma en el mundo donde quedaste
const S=Math.min(stage,6);
const boost={shield:!!carry?.shield,magnet:false,double:false}; // activos en esta partida
// El protagonista siempre tiende su propio camino (PATH); lo que cambia de un mundo a otro es el escenario:
// color del suelo sin construir, material de cimas y llanuras, y el clima que cruza la pantalla.
const PATH='dirt';
const THEMES=[ // ocho biomas que se van turnando; id = escenario del motor, wx = clima en pantalla, hour = luz fija
 {name:'PRADERA',id:'petals',ground:'#B9D88E',hill:'grass',wx:'petals',hour:10},
 {name:'DESIERTO',id:'sand',ground:'#E8D29A',hill:'sand',wx:'sand',hour:13},
 {name:'COSTA',id:'costa',ground:'#F4E6BC',hill:'sand',wx:'bubbles',hour:12},
 {name:'NIEVE',id:'snow',ground:'#EDF3F6',hill:'snow',wx:'snow',hour:11},
 {name:'BOSQUE',id:'leaves',ground:'#8DB36A',hill:'moss',wx:'leaves',hour:15.5},
 {name:'VOLCÁN',id:'volcan',ground:'#7A6462',hill:'basalt',hillColor:'#5E4E50',wx:'embers',hour:15},
 {name:'BAMBÚ',id:'bambu',ground:'#A9C873',hill:'moss',wx:'bamboo',hour:11.5},
 {name:'PUEBLO',id:'pueblo',ground:'#E0CBA6',hill:'plaza',hillColor:'#CDB38A',wx:'lanterns',hour:14.5},
];
const theme=THEMES[stage%THEMES.length];

// ── Nivel ──
// zone[y]: 'land' | 'sea' | 'sky' | 'rail' (se construye al pasar) · 'free' (ya hecho: muelles, cimas, estaciones)
const COLS=5,ROWS=QUICK?130:264,START=ROWS-12;
const LEVELS=2,LV=.42,SKY=LEVELS*LV; // altura de la cima y del cielo (LV = alto de un nivel del motor)
const rnd=(()=>{let a=(Date.now()^0x9E3779B9)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
const pick=a=>a[Math.floor(rnd()*a.length)];
let art=artFor(skinId);
const tiles={},zone=new Array(ROWS).fill('free'),blockers=[],coins=[],rides=[],vehicles=[];
const paintRow=(y,t)=>{for(let x=0;x<COLS;x++)tiles[x+','+y]=typeof t==='string'?{g:t,h:0}:{...t};};
setGroundColor('empty',theme.ground);if(theme.hillColor)setGroundColor(theme.hill,theme.hillColor);setHour(theme.hour);
for(let y=0;y<ROWS;y++)paintRow(y,theme.hill);
let cur=START-1,uid=0;
const OBST={land:[ROCK,STUMP],sea:[REEF,FIN,BARREL],sky:[PEAK,PEAK,CLOUD,STORM],rail:[BARRIER,CRATE,ROCK]};
const LIVE={sea:FIN,sky:STORM,rail:CART};
const PRIZE={land:[GEM,'JOYA'],sea:[PEARL,'PERLA'],sky:[STAR,'ESTRELLA'],rail:[GEM,'JOYA']};
function fill(n,kind,{gap,lead,extra}){
 let safe=2;const air=kind==='sky',lift=air?SKY:0;
 for(let i=0;i<n;i++){const y=cur-i;zone[y]=kind;paintRow(y,'empty');
  const coin=x=>coins.push({id:'c'+uid++,kind:'paper',svg:COIN,x,y,w:.62,h:.62,value:10,lift});
  if(i>=lead&&(i-lead)%gap===0&&i<n-1){
   const prev=safe;safe=pick([-2,-1,1,2].map(d=>prev+d).filter(x=>x>=0&&x<COLS));
   const blocked=new Set([prev]),pool=[0,1,2,3,4].filter(x=>x!==safe&&x!==prev);
   for(let k=0;k<extra&&pool.length>1;k++)blocked.add(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
   // Desde el mundo 2 algunos obstáculos están vivos: tiburones, nubarrones y gallinas van y vienen entre dos carriles
   // (nunca pisan el carril seguro). Cuanto más avanzado el mundo, más de ellos se mueven.
   let alive=LIVE[kind]&&S>=1&&rnd()<(S>=3?.6:.38)?[...blocked].map(x=>[x,[x-1,x+1].filter(n=>n>=0&&n<COLS&&n!==safe&&!blocked.has(n))]).find(([x,ns])=>ns.length):null;
   for(const x of blocked){const live=alive&&alive[0]===x,b={id:'b'+uid++,kind:'paper',svg:live?LIVE[kind]:pick(OBST[kind]),x:air?x-.15:x,y:air?y-.15:y,w:air?1.3:1,h:air?1.3:1,lift,cx:x,cy:y};
    if(live)b.mv={a:x,b:pick(alive[1]),period:2.6+rnd()*1.2-S*.12,phase:rnd()*3};
    blockers.push(b);}
   coin(safe);
   if(pool.length&&rnd()<.4)coins.push({id:'c'+uid++,kind:'paper',svg:PRIZE[kind][0],label:PRIZE[kind][1],x:pick(pool),y,w:.7,h:.7,value:50,prize:true,lift});
  }else if(i>1)coin(safe);
 }
 cur-=n;
}
const free=(n,t)=>{for(let i=0;i<n;i++){zone[cur-i]='free';paintRow(cur-i,t);}cur-=n;};
const park=(type,frames,board,size,lift=0)=>{const id='ride'+rides.length;vehicles.push({id,type,kind:'paper',svg:frames.idle[0],frames,fps:type==='boat'?5:6,x:2-(size-1)/2,y:board-(size-1)/2,w:size,h:size,lift});return id;};
// Cada mundo aprieta más: obstáculos más seguidos, más carriles cerrados y tramos más largos
const diff=hard=>({gap:hard||S>=2?2:3,lead:2,extra:hard||S>=1?2:1});
const RIDE={
 // Mar: muelle → barco → ruta de agua → playa
 sea(len,hard){free(2,'wood');const board=cur;free(2,'water');const id=park('boat',art.BOAT,board,1.6);fill(len,'sea',diff(hard));const land=cur;free(3,'sand');rides.push({board,land,id,type:'boat'});},
 // Cielo: escalón ya hecho → cima con globo → tiles de cielo → otra cima y bajada
 sky(len,hard){
  for(let k=0;k<LEVELS;k++)free(1,{g:theme.hill,h:k,r:[0,-1]});
  const board=cur;free(2,{g:theme.hill,h:LEVELS});const id=park('balloon',art.BALLOON,board,2,SKY); // el globo espera parado sobre la cima
  fill(len,'sky',diff(hard));
  const land=cur;free(2,{g:theme.hill,h:LEVELS});for(let k=LEVELS-1;k>=0;k--)free(1,{g:theme.hill,h:k,r:[0,1]});
  rides.push({board,land,id,type:'balloon'});},
 // Vías: estación → tren → rieles → estación
 rail(len,hard){const board=cur;free(2,'stone');const id=park('train',art.TRAIN,board,1.7);fill(len,'rail',diff(hard));const land=cur;free(3,'stone');rides.push({board,land,id,type:'train'});},
};
const land=(n,first)=>fill(n,'land',{gap:S>=2?3:4,lead:first?7:3,extra:first?0:S>=3?2:1});
{const order=['sea','sky','rail'];for(let i=0;i<stage%3;i++)order.push(order.shift());
 if(QUICK){land(8,true);order.forEach(k=>{RIDE[k](6,false);land(4);});}
 else{const more=Math.min(S,4);land(12,stage===0);order.forEach((k,i)=>{RIDE[k]((k==='rail'?16:14)+more,false);land(8);});order.forEach((k,i)=>{RIDE[k]((k==='rail'?20:18)+more,true);land(i<2?8:6);});}}
free(6,theme.hill);const GOAL=cur+2;
const goal={id:'goal',kind:'paper',svg:GATE,x:1,y:GOAL-1,w:3,h:3};
const player={id:'kami',kind:'paper',svg:art.HERO.idle[0],frames:art.HERO,fps:9,x:2,y:START,w:1.15,h:1.15};
const path={[START]:{x:2,e:2,lanes:{2:1}}};
// Velocidad: sube suave y continua dentro del mundo; cada mundo arranca un poco más rápido y acelera más
const speedAt=prog=>Math.min(3.8,1.3+(stage>=1?.22:0)+Math.min(stage,10)*.13+(.8+S*.09)*Math.pow(Math.max(0,Math.min(1,prog)),1.2));
const runner={fx:theme.id,playerId:player.id,startRow:START,lane:2,visualLane:2,speed:speedAt(0),distance:0,steps:0,autoAdvance:true,started:false,obstacles:[],coins,path,buildRow:START-1,buildLane:2,lastBuildLane:2,boatId:null,onBoat:false,onCoin,onCoinMiss,onGameOver};
const opts={cols:COLS,rows:ROWS,tiles,items:[player,goal,...vehicles,...blockers,...coins],mode:'placing',preview:false,rain:false,tool:'move',paints:false,valid:null,selected:null,OBJS:{},runner,onTap:()=>{},onCell:()=>{},onMiss:()=>{},onTile:()=>{}};
const host=$('stage');
if(!mountScene(host,opts))document.body.innerHTML='<p style="color:white;padding:24px">Este dispositivo no pudo iniciar WebGL.</p>';
const toast=$('toast'),hint=$('hint'),gameover=$('gameover');

// ── Sonido: cada tile es una nota, así la carrera suena como una cajita de música que se acelera ──
let ac=null,out=null;
function audio(){if(muted)return null;try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const comp=ac.createDynamicsCompressor();out=ac.createGain();out.gain.value=.9;out.connect(comp).connect(ac.destination);}if(ac.state==='suspended')ac.resume();}catch{}return ac;}
function tone(f,d=.09,type='triangle',v=.05,to=0,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(out);o.start(t);o.stop(t+d+.02);}
let noiseBuf=null;
function noise(d=.1,{f=1200,to=0,q=1,v=.08,type='bandpass',delay=0}={}){const a=audio();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.6,a.sampleRate);const c=noiseBuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
 const t=a.currentTime+delay,s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(out);s.start(t);s.stop(t+d+.02);}
const PENTA=[0,2,4,7,9],TUNE=[0,1,2,1,3,2,4,2,3,1,2,0,1,2,4,3];let tuneAt=0;
const semi=n=>Math.pow(2,n/12);
const SFX={
 // tile colocado: una nota de la melodía con el timbre del tramo; extra = tile lateral (suena una octava arriba)
 tile(kind,extra){const n=PENTA[TUNE[tuneAt++%TUNE.length]]+(extra?12:0);
  if(kind==='water'){tone(196*semi(n),.11,'sine',.07,392*semi(n));noise(.05,{f:900,v:.02});}
  else if(kind==='sky'){tone(523*semi(n),.32,'triangle',.035);tone(1046*semi(n),.2,'sine',.02,0,.01);}
  else if(kind==='rail'){noise(.03,{f:3200,q:3,v:.07});noise(.03,{f:2600,q:3,v:.05,delay:.075});tone(98,.07,'sine',.07,70);tone(262*semi(n),.08,'triangle',.02);}
  else{tone(262*semi(n),.13,'sine',.075);tone(1048*semi(n),.03,'sine',.03);noise(.015,{f:2200,v:.025});}},
 whoosh(){noise(.13,{f:500,to:2600,q:.8,v:.045});},
 coin(streak){const s=semi(Math.min(streak,12));tone(988*s,.07,'square',.028);tone(1319*s,.16,'square',.028,0,.065);},
 prize(){[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.14,'triangle',.05,0,i*.055));},
 streak(){[660,880,1109,1320].forEach((f,i)=>tone(f,.12,'triangle',.05,0,i*.06));},
 near(){noise(.07,{f:1800,to:4200,q:2,v:.04});tone(1200,.06,'sine',.03,1900);},
 faster(){tone(300,.32,'sawtooth',.03,950);noise(.3,{f:400,to:3000,v:.03});},
 board(type){if(type==='boat'){noise(.45,{f:1400,to:300,type:'lowpass',v:.2});tone(392,.2,'sine',.05,523,.1);}
  else if(type==='balloon'){noise(.5,{f:300,to:1800,v:.05});[392,523,659,880].forEach((f,i)=>tone(f,.18,'sine',.06,0,i*.07));}
  else{tone(880,.28,'square',.03);tone(1109,.28,'square',.03);tone(880,.2,'square',.03,0,.34);tone(1109,.2,'square',.03,0,.34);}},
 arrive(){[523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.06,0,i*.08));},
 win(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.2,'triangle',.06,0,i*.1));},
 lose(){tone(330,.4,'sawtooth',.05,80);noise(.25,{f:600,to:120,type:'lowpass',v:.12});},
 tap(){tone(660,.05,'triangle',.04);},
 buy(){noise(.06,{f:5000,q:4,v:.06});tone(1568,.1,'square',.03,0,.05);tone(2093,.3,'square',.03,0,.13);},
 nope(){tone(180,.12,'sawtooth',.04);},
};
// Música: no hay bucle sintetizado. Si existe kanjuu-demo/music.mp3 (una pista real), se reproduce en bucle
// y acompaña la velocidad; si no existe, el juego suena solo con sus efectos.
const Music={el:null,mode:'menu',ok:true,
 start(){if(muted||!this.ok)return;if(!this.el){this.el=new Audio('./kanjuu-demo/music.mp3');this.el.loop=true;this.el.volume=.45;this.el.addEventListener('error',()=>{this.ok=false;});}this.el.play().catch(()=>{});},
 stop(){this.el?.pause();},
 sync(){if(this.el&&!this.el.paused){this.el.playbackRate=this.mode==='run'?Math.min(1.25,1+(runner.speed-1.4)*.09):1;this.el.volume=this.mode==='run'?.45:.3;}}
};
const buzz=p=>{try{navigator.vibrate?.(p)}catch{}};
const setMuteIcon=()=>{$('mute').textContent=muted?'×':'♪';$('mute2').textContent=muted?'× SONIDO':'♪ SONIDO';};setMuteIcon();
function toggleMute(){muted=!muted;store.set('mute',muted);setMuteIcon();if(muted)Music.stop();else{audio();Music.start();SFX.tap();}}
$('mute').addEventListener('click',toggleMute);$('mute2').addEventListener('click',toggleMute);

// ── Premios visuales y puntaje ──
let toastTimer;
function showToast(msg){toast.textContent=msg;toast.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.opacity='0',1100);}
function pop(text,cls=''){const el=document.createElement('div');el.className='pop '+cls;el.textContent=text;el.style.left=(50+(Math.random()*24-12))+'%';el.style.top=(48+Math.random()*6)+'%';document.body.appendChild(el);setTimeout(()=>el.remove(),820);}
const bump=id=>{const el=$(id);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');};
let score=carry?.score||0,coinCount=carry?.coins||0,banked=carry?.coins||0,streak=carry?.streak||0;
$('score').textContent=score.toLocaleString('es');$('coinsN').textContent=coinCount;
const mult=()=>Math.min(5,1+Math.floor(streak/6));
const fmt=n=>n.toLocaleString('es');
function addScore(n){score+=n;$('score').textContent=fmt(score);}
let maxMult=carry?.maxMult||1;
function showCombo(){const c=$('combo'),m=mult();maxMult=Math.max(maxMult,m);if(m>1){c.textContent='x'+m+' RACHA';c.style.opacity='1';}else c.style.opacity='0';}
showCombo();
// las monedas se guardan en el monedero al terminar cada mundo y al perder
function bank(){wallet+=coinCount-banked;banked=coinCount;store.set('wallet',wallet);}
function onCoin(id){const c=coins.find(x=>x.id===id);if(!c)return;const before=mult();streak++;const gain=c.value*mult();addScore(gain);coinCount+=(c.prize?5:1)*(boost.double?2:1);$('coinsN').textContent=coinCount;bump('coinPill');

 if(runner.blockedByRock!=null&&runner.blockedByRock>=y)return [air?'¡CHOQUE EN EL AIRE!':sea?'¡CHOQUE!':rail?'¡DESCARRILÓ!':'¡TROPEZÓN!',air?'El globo no atraviesa picos ni nubes. Arrastrá hacia un costado.':sea?'El barco no pasa por encima de un obstáculo. Arrastrá hacia un costado.':rail?'El tren no pasa por encima de un obstáculo. Cambiá de vía a tiempo.':'No se puede pasar por encima de un obstáculo. Arrastrá hacia un costado.'];

 runnerHideItems(ids);runner.blockedByRock=null;runner.hitPause=0;runner.gameOver=false;buildToward(prevExit(y));
 $('flash').style.opacity='.6';setTimeout(()=>$('flash').style.opacity='0',160);SFX.streak();buzz([20,40,20]);runnerPulse('hop');drawBoosts();
}

// ── Construcción: el camino avanza solo; tocar o arrastrar cambia de carril ──
// La fila objetivo es siempre la siguiente. Su primer tile entra adelante o en diagonal y, mientras no se llegue
// a su centro, se puede extender a los costados. El tile se elige solo según el tramo. No se construye sobre obstáculos.
const clampLane=l=>Math.max(0,Math.min(COLS-1,Math.round(l)));
const blockSet=new Set(blockers.filter(b=>!b.mv).map(b=>b.cx+','+b.cy));
const movers={};blockers.filter(b=>b.mv).forEach(b=>(movers[b.cy]||=[]).push(b));
const isRockCell=(x,y)=>blockSet.has(x+','+y)||!!movers[y]?.some(m=>Math.round(moverLane(m.mv))===x);
// un obstáculo vivo puede llegar a un tile ya construido: si te alcanza, es choque
function moverHit(){const pos=START-runner.distance,r=Math.round(pos),ms=movers[r];if(!ms||Math.abs(pos-r)>.42)return;
 if(ms.some(m=>Math.abs(moverLane(m.mv)-(runner.visualLane??runner.lane))<.55)){runner.blockedByRock=r;runner.gameOver=true;onGameOver();}}
const targetRow=()=>Math.ceil(START-runner.distance)-1;
const prevExit=y=>runner.path[y+1]?.x??runner.lastBuildLane;
const MAT={land:PATH,sea:'water',sky:'sky',rail:'rail'};
let lastWhoosh=0;
// Vías: cada tile recuerda por dónde entra y por dónde sale el riel, así las curvas y diagonales se pintan solas
const railT={};
function railPort(x,y,patch){const k=x+','+y,t=railT[k];if(!t)return;Object.assign(t,patch);updateRunnerTile(x,y,t);}
function setTile(x,y,extra){const z=zone[y];if(z==='free')return;const g=MAT[z],tile=z==='sky'?{g,h:LEVELS,float:true}:z==='rail'?(railT[x+','+y]||={g,h:0,in:'S',out:'N'}):{g,h:0};tiles[x+','+y]=tile;updateRunnerTile(x,y,tile);addScore(1);SFX.tile(g,extra);}
function moved(){const now=performance.now();if(now-lastWhoosh>90){lastWhoosh=now;SFX.whoosh();buzz(6);}}
function buildToward(lane){
 if(runner.gameOver)return false;
 const y=targetRow();if(y<0)return false;
 runner.buildRow=y;
 lane=clampLane(lane??runner.buildLane);
 const row=runner.path[y];
 if(!row){
  const from=prevExit(y);
  let x=Math.abs(lane-from)>1?from+Math.sign(lane-from):lane;
  if(isRockCell(x,y)){
   if(x!==from&&!isRockCell(from,y))x=from;
   else{runner.blockedByRock=y;return false;}
  }
  if(zone[y]==='rail'){railT[x+','+y]={g:'rail',h:0,in:x===from?'S':x>from?'SW':'SE',out:'N'};railPort(from,y+1,{out:x===from?'N':x>from?'NE':'NW'});}
  setTile(x,y,false);runner.path[y]={x,e:x,lanes:{[x]:1}};
  runner.lastBuildLane=x;runner.steps++;if(x!==from)moved();
  return true;
 }
 if(lane===row.x)return false;
 const nx=row.x+Math.sign(lane-row.x);
 if(isRockCell(nx,y))return false;
 if(zone[y]==='rail'){const east=nx>row.x;railPort(row.x,y,{out:east?'E':'W'});if(nx in row.lanes)railPort(nx,y,{out:'N'});else railT[nx+','+y]={g:'rail',h:0,in:east?'W':'E',out:'N'};}
 if(!(nx in row.lanes)){setTile(nx,y,true);row.lanes[nx]=1;runner.steps++;}
 row.x=nx;runner.lastBuildLane=nx;moved();
 return true;
}
function refreshHints(){
 const y=targetRow();if(y<0||runner.gameOver||zone[y]==='free'){runner.hints=[];return;}
 const z=zone[y];runner.hintColor=z==='sea'?'#FFFFFF':z==='sky'?'#7FC8FF':'#F2B937';
 const liftOf=x=>z==='sky'&&!tiles[x+','+y]?.float?SKY:0;
 const row=runner.path[y],want=clampLane(runner.buildLane??runner.lastBuildLane),o=[];
 if(!row){const from=prevExit(y);for(const x of [from-1,from,from+1])if(x>=0&&x<COLS&&!isRockCell(x,y))o.push({x,y,lift:liftOf(x),main:x===(Math.abs(want-from)>1?from+Math.sign(want-from):want)});}
 else for(const x of [row.x-1,row.x+1])if(x>=0&&x<COLS&&!isRockCell(x,y))o.push({x,y,lift:liftOf(x),main:buildHeld&&want!==row.x&&Math.sign(want-row.x)===Math.sign(x-row.x)});
 runner.hints=o;
}
function laneFromPointer(e){const lane=runnerLaneAtScreen(e.clientX,e.clientY);if(lane!==null)runner.buildLane=lane;}

// ── Eventos al entrar a cada fila ──
const RIDES={boat:{y:-.12,boost:1.15,on:'¡A NAVEGAR!',off:'¡TIERRA!'},balloon:{y:SKY+.12,boost:1.15,on:'¡A VOLAR!',off:'¡ATERRIZAJE!',steer:SKY,leave:'up'},train:{y:.03,boost:1.3,on:'¡TODOS A BORDO!',off:'¡ESTACIÓN!',leave:'side'}};
let lastRow=START,rideIndex=0,ridesDone=carry?.rides||0,gear=0;
function enterRow(r){
 addScore(1);
 const ride=rides[rideIndex];
 if(ride&&r===ride.board){const R=RIDES[ride.type];runner.boatId=ride.id;runner.onBoat=true;runner.rideType=ride.type;runner.vehicleY=R.y;runner.steerY=R.steer??null;
  SFX.board(ride.type);buzz([15,40,25]);pop(R.on,'big');runnerPulse('hop');if(ride.type==='boat'){$('flash').style.opacity='.5';setTimeout(()=>$('flash').style.opacity='0',120);}}
 if(ride&&r===ride.land+1){const R=RIDES[ride.type];runner.onBoat=false;runner.leaveBoat=ride.id;runner.leaveMode=R.leave;runner.steerY=null;rideIndex++;ridesDone++;missionAdd('ride');
  const bonus=200*Math.min(ridesDone,10);addScore(bonus);bump('score');pop(R.off+' +'+bonus,'big');SFX.arrive();buzz([20,30,20,30,40]);runnerPulse('hop');}
 // roce: pasar pegado a un obstáculo
 const row=runner.path[r];if(row&&zone[r]!=='free'){const ls=Object.keys(row.lanes).map(Number);if(ls.some(x=>isRockCell(x-1,r)||isRockCell(x+1,r))){missionAdd('near');addScore(5*mult());pop('¡CASI! +'+5*mult());SFX.near();}}
 // la velocidad sube de a poco durante todo el mundo (y cada mundo arranca más rápido)
 Music.sync();
 const prog=(START-r)/(START-GOAL);$('progress').firstElementChild.style.width=Math.min(100,prog*100)+'%';
 const base=speedAt(prog);runner.speed=base*(runner.onBoat?RIDES[runner.rideType].boost:1);
 const g=Math.floor((base-speedAt(0))/.25);if(g>gear){gear=g;pop('¡MÁS RÁPIDO!','big');SFX.faster();buzz(25);}
 $('speed').style.opacity=Math.max(0,Math.min(.9,(runner.speed-1.9)/1.3));
 if(r<=GOAL)nextWorld();
}
function refreshUI(){
 const y=targetRow(),ride=rides[rideIndex],toBoard=ride&&!runner.onBoat?y-ride.board:99;
 const name={boat:'BARCO',balloon:'GLOBO',train:'TREN'}[ride?.type];
 hint.textContent=paused?'':!runner.started?'TOCÁ PARA EMPEZAR A CORRER':runner.onBoat?'TOCÁ O ARRASTRÁ PARA ESQUIVAR':toBoard<12?name+' ADELANTE · PREPARATE':'TOCÁ O ARRASTRÁ PARA CAMBIAR DE CARRIL';
}

// ── Entrada: un dedo. Tocar = un carril hacia ese lado; mantener y arrastrar = seguir al dedo ──
let buildHeld=false,lateralClock=0,lastFrame=performance.now();
let paused=false;
function begin(){if(!runner.started&&!paused){runner.started=true;audio();Music.start();Music.mode='run';document.body.classList.remove('home');}}
host.addEventListener('pointerdown',e=>{if(runner.gameOver||menuOpen||paused)return;begin();buildHeld=true;lateralClock=0;laneFromPointer(e);buildToward(runner.buildLane);try{host.setPointerCapture(e.pointerId);}catch{}e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointermove',e=>{if(!buildHeld)return;laneFromPointer(e);e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointerup',e=>{buildHeld=false;e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointercancel',()=>{buildHeld=false;},true);
// Teclado (escritorio): ←/→ o A/D cambian de carril
window.addEventListener('keydown',e=>{
 if(runner.gameOver||menuOpen||paused)return;const k=e.key.toLowerCase();
 if(!['arrowup','w','arrowleft','a','arrowright','d',' '].includes(k))return;e.preventDefault();begin();
 if(e.repeat||k==='arrowup'||k==='w'||k===' ')return;
 const y=targetRow(),row=runner.path[y],base=row?row.x:prevExit(y);
 runner.buildLane=clampLane(base+(k==='arrowleft'||k==='a'?-1:1));buildToward(runner.buildLane);
});
function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;
 const y=targetRow();runner.buildRow=y;
 if(!runner.gameOver&&y>=0&&runner.started){
  if(!runner.path[y])buildToward(buildHeld?runner.buildLane:prevExit(y));
  if(buildHeld&&runner.path[y]&&clampLane(runner.buildLane)!==runner.path[y].x){lateralClock-=dt;if(lateralClock<=0){lateralClock=.07;buildToward(runner.buildLane);}}
  moverHit();
  const r=Math.ceil(START-runner.distance);while(lastRow>r&&!runner.gameOver){lastRow--;enterRow(lastRow);if(runner.gameOver)break;}
 }
 refreshHints();if(!runner.gameOver)refreshUI();
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// mundo guardado: se retoma donde quedaste; tocar la etiqueta recorre los mundos ya alcanzados
const maxWorld=Math.max(store.get('maxWorld',0),stage);

{const wx=$('wx'),R=(a,b)=>a+Math.random()*(b-a),add=(cls,css)=>{const e=document.createElement('i');e.className=cls;e.style.cssText=css;wx.appendChild(e);};wx.className=theme.wx;
 const leaf='80% 10% 80% 10%',W={petals:['fall',['#F7B7C8'],12,'70% 10% 70% 10%',[9,13],[6,9],[4,8]],snow:['fall',['#FFFFFF'],22,'50%',[5,10],0,[4,8]],leaves:['fall',['#C9A23C','#7FA84F'],12,leaf,[10,14],[6,9],[4,8]],
  bamboo:['fall',['#9CCB5A','#6FA84A'],12,leaf,[12,17],[4,6],[4,8]],bubbles:['rise',['#FFFFFFCC','#CFF1FA'],12,'50%',[6,12],0,[5,9]],embers:['rise',['#FF9A3C','#FFD46B','#FF6A2B'],20,'50%',[4,8],0,[2.5,5]],lanterns:['rise',['#FFD46B','#F29BB8','#E8452C'],10,'35%',[8,11],[10,14],[7,11]]}[theme.wx];
 if(theme.wx==='sand'){for(let i=0;i<9;i++)add('gust',`top:${R(4,96)}%;height:${R(2,5)}px;opacity:${R(.35,.85)};animation-duration:${R(1.1,2.4)}s;animation-delay:${-R(0,3)}s`);
  for(let i=0;i<16;i++)add('wxp grain',`top:${R(0,100)}%;width:${R(3,6)}px;height:${R(3,6)}px;border-radius:50%;background:#f3e2b2;--sway:${R(-60,60)}px;animation-duration:${R(.9,2)}s;animation-delay:${-R(0,2)}s`);}
 else if(W)for(let i=0;i<W[2];i++){const w=R(...W[4]);add('wxp '+W[0],`left:${R(0,100)}%;width:${w}px;height:${W[5]?R(...W[5]):w}px;border-radius:${W[3]};background:${W[1][i%W[1].length]};opacity:${R(.6,.95)};--sway:${R(-70,70)}px;animation-duration:${R(...W[6])}s;animation-delay:${-R(0,W[6][1])}s`);}}
// jugo visual
function sparks(n){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='spark';const a=Math.random()*6.28,d=50+Math.random()*60;e.style.left='50%';e.style.top='54%';document.body.appendChild(e);e.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d-4}px,${Math.sin(a)*d-40}px) scale(.2) rotate(180deg)`,opacity:0}],{duration:420+Math.random()*200,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>e.remove();}}
function flyCoin(){const t=$('coinPill').getBoundingClientRect(),e=document.createElement('div');e.className='fly';e.innerHTML=ico('coin');e.style.left=innerWidth/2-17+'px';e.style.top=innerHeight*.5+'px';document.body.appendChild(e);e.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${t.left+8-innerWidth/2}px,${t.top-innerHeight*.5}px) scale(.6)`}],{duration:380,easing:'cubic-bezier(.5,-.3,.7,1)'}).onfinish=()=>{e.remove();bump('coinPill');};}
function confetti(){const C=['#F2B937','#E8452C','#5DB84F','#3E5BA9','#FFF4DC','#F29BB8'];for(let i=0;i<46;i++){const e=document.createElement('div');e.className='bit';e.style.left=Math.random()*100+'%';e.style.background=C[i%C.length];e.style.animationDuration=1.4+Math.random()*1.6+'s';e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3800);}}
$('play').addEventListener('click',()=>{audio();const k=SKINS[browse];
 if(!owned.includes(k.id)){const p=$('play');if(!buy(k.price,k.name)){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');return;}owned.push(k.id);store.set('owned',owned);skinId=k.id;store.set('skin',skinId);pop('¡'+k.name.toUpperCase()+'!','big');drawHome();drawShop();return;}
 SFX.tap();useItems();menuOpen=false;$('menu').style.display='none';banner('MUNDO '+(stage+1)+' · '+theme.name);begin();});
function banner(t){const b=$('banner');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
$('pause').addEventListener('click',()=>{if(ended||!runner.started)return;paused=true;runner.started=false;Music.mode='menu';$('paused').style.display='flex';});
$('resume').addEventListener('click',()=>{$('paused').style.display='none';paused=false;begin();});
$('quit').addEventListener('click',()=>{bank();location.reload();});
if(menuOpen){drawHome();drawShop();$('menu').style.display='block';}
else{document.body.classList.remove('home');if(!carry)useItems();else drawBoosts();setTimeout(()=>banner('MUNDO '+(stage+1)+' · '+theme.name),300);}
(document.fonts?.ready||Promise.resolve()).then(()=>setTimeout(()=>{const sp=$('splash');sp.style.opacity=0;setTimeout(()=>sp.remove(),520);},700));
if(DEBUG)window.__dbg={runner,zone,rides,blockers,coins,stats:runnerStats,get score(){return score},get wallet(){return wallet},GOAL,START,stage};
