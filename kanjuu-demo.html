<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17152b">
<title>KANJŪ · Tile Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js"}}</script>
<style>
:root{color-scheme:dark;--ink:#211a20;--cream:#fff4dc;--gold:#f2b937;--night:#17152b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);font-family:'Zen Maru Gothic',sans-serif;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#17152b}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.14;mix-blend-mode:multiply}
.top{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{color:#fff4dc;font:900 14px 'DM Sans',sans-serif;letter-spacing:2px;text-shadow:0 2px 12px #17152b88}
.brand small{display:block;margin-top:4px;font:700 9px 'DM Sans',sans-serif;letter-spacing:1.7px;color:#fff4dcb0}
.pill{border:1px solid #fff4dc44;border-radius:999px;background:#17152b9c;color:#fff4dc;padding:7px 11px;font:800 10px 'DM Sans',sans-serif;letter-spacing:.8px;backdrop-filter:blur(12px)}
.editor{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);padding:12px;border:1px solid #fff4dc35;border-radius:20px;background:#17152be8;backdrop-filter:blur(16px);box-shadow:0 8px 32px #09081770;color:var(--cream)}
.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font:900 10px 'DM Sans',sans-serif;letter-spacing:1px}
.editor-head span:last-child{color:#f2b937}
.materials{display:flex;gap:7px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}
.material{flex:1;min-width:57px;border:1px solid #fff4dc35;border-radius:12px;background:#ffffff0b;color:var(--cream);padding:8px 5px;font:800 10px 'DM Sans',sans-serif}
.material.active{border-color:#f2b937;background:#f2b93722;color:#ffd46b}
.material i{display:block;width:19px;height:19px;border-radius:6px;margin:0 auto 5px;border:1px solid #fff4dc50}
.special{width:100%;border:1px solid #E5B75B66;border-radius:12px;background:#F2B9371C;color:#FFD46B;padding:10px;font:900 10px 'DM Sans',sans-serif;letter-spacing:.8px}
.hint{margin-top:8px;color:#fff4dc99;text-align:center;font:700 8px 'DM Sans',sans-serif;letter-spacing:.8px}
#toast{position:absolute;z-index:8;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);border-radius:999px;background:#fff4dc;color:#2b2320;padding:7px 12px;font:900 9px 'DM Sans',sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
@media(min-width:700px){.editor{max-width:520px;left:50%;right:auto;width:calc(100% - 32px);transform:translateX(-50%);bottom:18px}.materials{justify-content:center}}
 .lane-controls{position:absolute;z-index:7;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 204px);display:flex;justify-content:space-between;pointer-events:none}.lane-controls button{pointer-events:auto;width:54px;height:54px;border:1px solid #fff4dc66;border-radius:50%;background:#17152bbd;color:#fff4dc;font-size:24px;font-weight:900;backdrop-filter:blur(10px)}#gameover{display:none;position:fixed;z-index:20;inset:0;background:#100e20dd;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff4dc}#gameover>div{max-width:320px;padding:28px 22px;border:1px solid #fff4dc44;border-radius:24px;background:#211d39}#gameover h2{font:900 25px 'DM Sans',sans-serif;margin:0 0 10px}#gameover p{color:#fff4dcaa;font-size:13px;line-height:1.5}#restart{border:0;border-radius:12px;background:#f2b937;color:#211a20;padding:13px 24px;font:900 12px 'DM Sans',sans-serif;margin-top:10px}</style>
</head>
<body>
<div id="stage"><div class="stage-ov"></div></div>
<div class="top"><div class="brand">KANJŪ <small>TILE RUNNER · EDITOR</small></div><div class="pill" id="clock">AVANZANDO</div></div>
<div id="toast">TILE COLOCADO</div><div class="lane-controls" id="controls"><button id="left" aria-label="Mover a la izquierda">‹</button><button id="right" aria-label="Mover a la derecha">›</button></div><div id="gameover"><div><h2>FIN DEL RECORRIDO</h2><p id="gameReason"></p><button id="restart">VOLVER A JUGAR</button></div></div>
<section class="editor">
 <div class="editor-head"><span>MATERIAL: AGUA</span><span id="rowLabel">FILA SIGUIENTE · —</span></div>
 <div class="materials" id="materials">
  <button class="material" data-type="grass"><i style="background:#8DBF5E"></i>PASTO</button>
  <button class="material" data-type="dirt"><i style="background:#B98D5A"></i>TIERRA</button>
  <button class="material" data-type="sand"><i style="background:#E2CE97"></i>ARENA</button>
  <button class="material" data-type="moss"><i style="background:#5F9447"></i>MUSGO</button>
  <button class="material active" data-type="water"><i style="background:#5AA5D2"></i>AGUA</button>
  <button class="material" data-type="road"><i style="background:#555D68"></i>PAVIMENTO</button>
  <button class="material" data-type="ice"><i style="background:#B8E3F4"></i>HIELO</button>
 </div>
 <button class="special" id="ramp">↗ CONSTRUIR RAMPA DE SUBIDA</button>
 <div class="hint">MANTENÉ PRESIONADO Y ARRASTRÁ PARA CONSTRUIR EL CAMINO</div>
</section>
<script type="module">
import { mountScene, runnerLaneAtScreen, updateRunnerTile } from './kanjuu-demo/scene3d.js';
import { creatureSVG } from './kanjuu-demo/creature.js';
const COLS=5,ROWS=180,START=165;
const player={id:'hito-runner',kind:'mon',svg:creatureSVG('人',{mood:1}),x:2,y:START,w:1,h:1};
const boatSVG='<svg viewBox="0 0 140 110"><path d="M20 67 L120 67 L105 91 Q70 105 35 91Z" fill="#B94D36" stroke="#FFF4DC" stroke-width="7" stroke-linejoin="round"/><path d="M70 10 V66" stroke="#704332" stroke-width="6" stroke-linecap="round"/><path d="M65 16 L25 60 L65 60Z" fill="#FFF0D2" stroke="#FFF4DC" stroke-width="5" stroke-linejoin="round"/><path d="M77 23 L111 59 L77 59Z" fill="#E8A65B" stroke="#FFF4DC" stroke-width="5" stroke-linejoin="round"/><path d="M14 98 Q35 89 55 98 T96 98 T136 98" fill="none" stroke="#70C9E8" stroke-width="6" stroke-linecap="round"/></svg>';
const rockSVG='<svg viewBox="0 0 100 100"><path d="M12 82 L18 45 L40 18 L68 24 L88 55 L82 84Z" fill="#858B91" stroke="#FFF4DC" stroke-width="7" stroke-linejoin="round"/><path d="M20 51 L42 25 L52 55 L35 72Z" fill="#B8BEC0"/><path d="M57 32 L72 38 L82 59 L63 54Z" fill="#626A72"/></svg>';
const coinSVG='<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="30" fill="#F2B937" stroke="#FFF4DC" stroke-width="7"/><circle cx="40" cy="40" r="21" fill="none" stroke="#B87922" stroke-width="4"/><path d="M45 22 Q29 18 28 34 Q28 43 42 45 Q54 47 51 58 Q48 68 31 61" fill="none" stroke="#8A551E" stroke-width="6" stroke-linecap="round"/><path d="M40 17 V64" stroke="#8A551E" stroke-width="4" stroke-linecap="round"/></svg>';
const bridgeSVG='<svg viewBox="0 0 140 110"><path d="M12 76 Q70 20 128 76" fill="none" stroke="#8A5A3A" stroke-width="18" stroke-linecap="round"/><path d="M12 76 Q70 20 128 76" fill="none" stroke="#D5A16A" stroke-width="9" stroke-linecap="round"/><path d="M25 68 L33 86 M48 50 L55 72 M72 40 L77 63 M96 50 L91 72 M116 68 L108 86" stroke="#70452F" stroke-width="5"/></svg>';
const lavaSVG='<svg viewBox="0 0 140 110"><path d="M10 72 L25 42 L47 54 L68 18 L91 49 L112 35 L132 74 L120 91 L22 91Z" fill="#55515A" stroke="#FFF4DC" stroke-width="6"/><path d="M34 68 L50 60 L62 72 L78 46 L91 67 L108 58" fill="none" stroke="#FF7A36" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 83 L62 74 L75 86 L92 78" fill="none" stroke="#FFD36A" stroke-width="5"/></svg>';
const iceSVG='<svg viewBox="0 0 140 110"><path d="M10 88 L43 26 L63 56 L86 10 L132 88Z" fill="#A9D9E9" stroke="#FFF4DC" stroke-width="7" stroke-linejoin="round"/><path d="M43 26 L50 55 L63 56 M86 10 L93 53 L106 60" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/></svg>';
const floatingSVG='<svg viewBox="0 0 140 110"><path d="M12 56 Q70 20 128 56 L112 83 L28 83Z" fill="#6F9E55" stroke="#FFF4DC" stroke-width="7"/><path d="M28 83 L43 101 L96 101 L112 83" fill="#8B6749" stroke="#FFF4DC" stroke-width="6"/><path d="M46 51 Q70 32 94 51" fill="none" stroke="#BDEB8D" stroke-width="6" stroke-linecap="round"/></svg>';
const rockAt=(id,x,y)=>({id,kind:'paper',obstacle:'rock',svg:rockSVG,x,y,w:1,h:1,required:'cambiar de carril'});
const challenge=(id,obstacle,svg,y,required)=>({id,kind:'paper',obstacle,svg,x:2,y,w:1.4,h:1.1,required,requiredMaterial:({boat:'water',bridge:'wood',lava:'stone',ice:'ice',floating:'moss'})[obstacle],length:10});
const obstacles=[rockAt('rock-1',1,158),rockAt('rock-2',3,155),challenge('boat-1','boat',boatSVG,151,'10 tiles de agua'),rockAt('rock-3',1,145),rockAt('rock-4',3,140),challenge('bridge-1','bridge',bridgeSVG,122,'10 tiles de madera'),rockAt('rock-5',1,116),rockAt('rock-6',3,111),challenge('lava-1','lava',lavaSVG,93,'10 tiles de piedra'),rockAt('rock-7',1,87),rockAt('rock-8',3,82),challenge('ice-1','ice',iceSVG,64,'10 tiles de hielo'),rockAt('rock-9',1,58),rockAt('rock-10',3,53),challenge('floating-1','floating',floatingSVG,35,'10 tiles de musgo')];
const coins=[{x:2,y:160},{x:1,y:153},{x:3,y:149},{x:2,y:144},{x:1,y:136},{x:3,y:127},{x:2,y:117},{x:1,y:106},{x:3,y:96},{x:2,y:86},{x:1,y:75},{x:3,y:63},{x:2,y:52},{x:1,y:43},{x:3,y:34}].map((p,i)=>({id:'coin-'+i,kind:'paper',svg:coinSVG,x:p.x,y:p.y,w:.55,h:.65}));
const tiles={};for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)tiles[x+','+y]={g:'empty',h:0};
const path={};for(let y=START;y>=START-3;y--){path[y]={x:2,g:'grass'};tiles['2,'+y]={g:'grass',h:0};}
let selected='water';
const runner={playerId:player.id,startRow:START,lane:2,visualLane:2,speed:1.25,distance:0,steps:0,autoAdvance:true,obstacles,coins,path,buildRow:START-4,buildLane:2,lastBuildLane:2,ridingBoat:false,onObstacle,onCoin,onGameOver};
const opts={cols:COLS,rows:ROWS,tiles,items:[player,...obstacles,...coins],mode:'placing',preview:false,rain:false,tool:'move',paints:false,valid:null,selected:null,OBJS:{},runner,onTap:()=>{},onCell:()=>{},onMiss:()=>{},onTile:()=>{}};
const host=document.getElementById('stage');
if(!mountScene(host,opts))document.body.innerHTML='<p style="color:white;padding:24px">Este dispositivo no pudo iniciar WebGL.</p>';
const rowLabel=document.getElementById('rowLabel'),toast=document.getElementById('toast'),hint=document.querySelector('.hint'),gameover=document.getElementById('gameover');
let toastTimer;
function showToast(msg){toast.textContent=msg;toast.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.opacity='0',1100);}
function endGame(reason){if(gameover.style.display==='flex')return;runner.gameOver=true;runner.hitPause=999;document.getElementById('gameReason').textContent=reason;gameover.style.display='flex';}
function onGameOver(reason){endGame(reason);}
function onCoin(){runner.score=(runner.score||0)+1;document.getElementById('clock').textContent='MONEDAS '+runner.score;showToast('＋ 1 MONEDA');}
function onObstacle(id,success,required,material){const o=obstacles.find(x=>x.id===id);if(!o)return;if(!success){const names={boat:'agua',bridge:'madera',lava:'piedra',ice:'hielo',floating:'musgo'};endGame(o.obstacle==='rock'?'Hito chocó contra una piedra':'Faltó construir el tramo de '+(names[o.obstacle]||'camino'));return;}const messages={boat:'¡EL BARCO NAVEGA!',bridge:'¡PUENTE CONSTRUIDO!',lava:'¡CRUZASTE EL VOLCÁN!',ice:'¡CRUZASTE LA MONTAÑA!',floating:'¡ISLAS CONECTADAS!',rock:'¡BUEN ESQUIVE!'};showToast(messages[o.obstacle]||'¡BUEN TRABAJO!');}
function upcomingObstacle(){return obstacles.filter(o=>!o.resolved).map(o=>({...o,remaining:START-o.y-runner.distance})).filter(o=>o.remaining>=-.5).sort((a,b)=>a.remaining-b.remaining)[0];}
function refreshRow(){const next=upcomingObstacle();rowLabel.textContent=next&&next.remaining<25?next.obstacle.toUpperCase()+' · '+Math.max(0,Math.ceil(next.remaining))+' FILAS':'CONSTRUÍS · FILA '+runner.buildRow;}
function placeNext(lane=runner.buildLane){
 if(runner.gameOver||runner.buildRow<0)return;
 const currentRow=Math.floor(START-runner.distance);
 if(runner.buildRow>=currentRow)return;
 let x=Math.max(0,Math.min(COLS-1,Math.round(lane??runner.lastBuildLane)));
 if(Math.abs(x-runner.lastBuildLane)>1){x=runner.lastBuildLane+Math.sign(x-runner.lastBuildLane);showToast('UN CARRIL POR VEZ');}
 const y=runner.buildRow,tile={g:selected,h:0};
 tiles[x+','+y]=tile;runner.path[y]={x,g:selected};runner.lastBuildLane=x;runner.buildLane=x;runner.buildRow--;runner.steps++;
 updateRunnerTile(x,y,tile);
 showToast(({water:'AGUA',wood:'MADERA',stone:'PIEDRA',grass:'PASTO',dirt:'TIERRA',sand:'ARENA',road:'CAMINO',ice:'HIELO',moss:'MUSGO'})[selected]+' · CAMINO CONSTRUIDO');
 refreshRow();
}
function laneFromPointer(e){const lane=runnerLaneAtScreen(e.clientX,e.clientY);if(lane!==null)runner.buildLane=lane;}
function selectMaterial(type){selected=type;document.querySelectorAll('.material').forEach(b=>b.classList.toggle('active',b.dataset.type===type));const labels={water:'AGUA',wood:'MADERA',stone:'PIEDRA',grass:'PASTO',dirt:'TIERRA',sand:'ARENA',road:'PAVIMENTO',ice:'HIELO',moss:'MUSGO'};document.querySelector('.editor-head span:first-child').textContent='MATERIAL: '+labels[type];}
document.querySelectorAll('.material').forEach(b=>b.addEventListener('click',()=>selectMaterial(b.dataset.type)));
document.getElementById('controls').style.display='none';document.getElementById('restart').addEventListener('click',()=>location.reload());document.getElementById('ramp').style.display='none';
let buildHeld=false,buildClock=0,lastFrame=performance.now();
host.addEventListener('pointerdown',e=>{if(runner.gameOver)return;buildHeld=true;buildClock=0;laneFromPointer(e);placeNext(runner.buildLane);try{host.setPointerCapture(e.pointerId);}catch{}e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointermove',e=>{if(!buildHeld)return;laneFromPointer(e);e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointerup',e=>{buildHeld=false;e.preventDefault();e.stopPropagation();},true);
host.addEventListener('pointercancel',()=>{buildHeld=false;},true);
function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;if(buildHeld&&!runner.gameOver){buildClock+=dt;if(buildClock>=.42){buildClock=0;placeNext(runner.buildLane);}}if(!runner.gameOver){const next=upcomingObstacle();if(next&&next.remaining<25){const names={boat:'AGUA',bridge:'MADERA',lava:'PIEDRA',ice:'HIELO',floating:'MUSGO',rock:'CAMBIÁ DE CARRIL'};hint.textContent='PRÓXIMO RETO: '+(names[next.obstacle]||'CAMINO')+' · '+Math.max(0,Math.ceil(next.remaining))+' FILAS';}else hint.textContent='MANTENÉ PRESIONADO Y ARRASTRÁ PARA CONSTRUIR';refreshRow();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
