<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b8dff0">
<title>BUILD & RUN — Prototype 02</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8dff0;font-family:ui-rounded,system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#203047}.top{position:absolute;top:env(safe-area-inset-top,12px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px}.brand,.stat{font-weight:1000;background:#fffdf4;border:2px solid #203047;border-radius:12px;padding:8px 11px;box-shadow:3px 4px 0 #203047}.brand{font-size:11px;letter-spacing:.08em}.stats{display:flex;gap:7px}.stat{font-size:14px}.hint{position:absolute;top:72px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fffdf4eF;border:2px solid #203047;border-radius:999px;padding:8px 13px;font-size:11px;font-weight:900;box-shadow:2px 3px 0 #203047}
#controls{position:absolute;bottom:calc(17px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.cluster{display:flex;gap:9px;pointer-events:auto}.action{height:60px;min-width:66px;padding:0 13px;border:3px solid #203047;border-radius:17px;background:#fffdf4;color:#203047;font-size:12px;font-weight:1000;box-shadow:0 5px 0 #203047;touch-action:none;user-select:none}.action:active,.action.down{transform:translateY(4px);box-shadow:0 1px 0 #203047}.action.build{min-width:132px;background:#f7bd45}.action.jump{background:#91c6e8}.action small{display:block;font-size:9px;margin-top:2px}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#18304770;backdrop-filter:blur(5px);color:#203047;z-index:5}.panel{width:min(360px,88vw);background:#fffdf4;border:3px solid #203047;border-radius:24px;padding:25px;text-align:center;box-shadow:8px 9px 0 #203047}.panel h1{font-size:35px;line-height:.95;margin:0 0 12px;font-weight:1000}.panel p{line-height:1.5;color:#526174;font-weight:700;font-size:14px}.panel button{border:3px solid #203047;border-radius:14px;background:#f7bd45;padding:13px 25px;font-weight:1000;font-size:15px;color:#203047;box-shadow:0 5px 0 #203047}.hidden{display:none!important}
#toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:25px;font-weight:1000;color:#fffdf4;text-shadow:3px 4px 0 #203047;opacity:0;transition:opacity .15s;white-space:nowrap}
@media(min-width:700px){#controls{max-width:720px;left:50%;right:auto;width:100%;transform:translateX(-50%)}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js"}}</script>
</head>
<body>
<div id="hud">
 <div class="top"><div class="brand">BUILD <span style="color:#e38c37">&</span> RUN · TEST 02</div><div class="stats"><div class="stat">● <span id="coins">0</span></div><div class="stat">★ <span id="score">0</span></div></div></div>
 <div class="hint" id="hint">Deslizá para cambiar de carril · ↑ saltar</div><div id="toast">¡COMBO!</div>
 <div id="controls"><div class="cluster"><button class="action" id="left">◀<small>CARRIL</small></button><button class="action" id="right">▶<small>CARRIL</small></button></div><div class="cluster"><button class="action jump" id="jump">↑<small>SALTAR</small></button><button class="action build" id="build">CONSTRUIR<small>MANTENER</small></button></div></div>
</div>
<div id="overlay"><div class="panel"><h1>BUILD<br>& RUN</h1><p>Esquivá obstáculos, saltá barreras, juntá monedas y construí puentes antes de caer. ¡La velocidad aumenta!</p><button id="start">JUGAR</button></div></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color('#b8dff0');scene.fog=new THREE.Fog('#b8dff0',34,90);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,140);camera.position.set(0,8.5,14);camera.lookAt(0,1,-12);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x7894a1,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-7,13,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true});
const grass=mat('#82bd83'),road=mat('#e8c99a'),edge=mat('#c58e5c'),ink=mat('#34465b'),wood=mat('#c9874b'),wood2=mat('#edb86e'),cream=mat('#fff0d4'),blue=mat('#477fbd'),red=mat('#e98768'),gold=mat('#f7bd45'),green=mat('#65a982'),water=mat('#477fbd');
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
box(180,.5,180,grass,0,-.55,-40);
const roadMesh=box(7,.12,180,road,0,-.25,-40);
for(let x of [-3.65,3.65])box(.22,.38,180,edge,x,-.08,-40);
for(let i=0;i<32;i++){let z=8-i*5.5;box(.12,.08,1.1,cream,0,-.17,z)}
// little paper trees along the route
for(let i=0;i<24;i++){const z=-i*7-8;for(let side of [-1,1]){const x=side*(5.1+(i%3)*.35);box(.35,1.2,.35,wood,x,.35,z);const crown=box(1.3,1.25,.8,green,x,1.45,z);crown.rotation.z=(i%2?.12:-.12)}}
// runner
const runner=new THREE.Group();scene.add(runner);runner.position.set(0,0,4.2);
box(.72,1.05,.42,blue,0,1.1,0,runner);
const head=new THREE.Mesh(new THREE.SphereGeometry(.43,7,6),cream);head.position.set(0,1.92,0);head.castShadow=true;runner.add(head);
box(.12,.12,.06,ink,-.16,1.98,.38,runner);box(.12,.12,.06,ink,.16,1.98,.38,runner);
box(.18,.42,.2,red,-.48,1.12,0,runner);box(.18,.42,.2,red,.48,1.12,0,runner);box(.38,.46,.22,wood,0,1.18,-.32,runner);
const legs=[box(.23,.62,.25,ink,-.2,.31,0,runner),box(.23,.62,.25,ink,.2,.31,0,runner)];
const laneX=[-2.15,0,2.15];let lane=1,jumpY=0,jumpV=0,holding=false,buildProgress=0,coins=0,score=0,speed=13,alive=false,gameOver=false,runTime=0,combo=0,lastAction=0;
const objects=[];let nextZ=-24,spawnCount=0;const $=id=>document.getElementById(id);
function makeCoin(x,z){const g=new THREE.Group();g.position.set(x,1.1,z);const a=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.12,12),gold);a.rotation.x=Math.PI/2;a.castShadow=true;g.add(a);const dot=box(.1,.1,.04,cream,0,0,.08,g);objects.push({kind:'coin',mesh:g,hit:false});scene.add(g)}
function makeBlock(x,z,kind){const g=new THREE.Group();g.position.set(x,0,z);if(kind==='barrier'){box(1.65,.65,.5,red,0,.85,0,g);box(1.8,.13,.58,cream,0,1.2,0,g)}else{box(1.25,1.35,1.05,wood,0,.7,0,g);box(1.28,.18,1.08,wood2,0,1.43,0,g)}scene.add(g);objects.push({kind:'obstacle',sub:kind,mesh:g,hit:false})}
function makeGap(z){const g=new THREE.Group();g.position.set(0,0,z);box(7.1,.15,8,water,0,-.38,0,g);box(7.1,.08,8,ink,0,-.5,0,g);const rails=[box(.18,.2,8,edge,-3.5,-.1,0,g),box(.18,.2,8,edge,3.5,-.1,0,g)];const planks=[];for(let i=0;i<12;i++){const p=box(6.8,.18,.62,wood2,0,-.02,-3.55+i*.65,g);p.visible=false;planks.push(p)}scene.add(g);objects.push({kind:'gap',mesh:g,planks:planks,built:0,hit:false,passed:false})}
function makeRamp(x,z){const g=new THREE.Group();g.position.set(x,0,z);const r=new THREE.Mesh(new THREE.BoxGeometry(1.8,.28,2.5),gold);r.position.set(0,.45,0);r.rotation.x=-.23;r.castShadow=true;g.add(r);box(1.8,.18,.3,wood2,0,.2,1,g);scene.add(g);objects.push({kind:'ramp',mesh:g,hit:false})}
function spawnPattern(){const z=nextZ;const n=spawnCount++%7;const safe=laneX[Math.floor(Math.random()*3)];if(n===0){makeGap(z);makeCoin(-2.15,z-9);makeCoin(0,z-9);makeCoin(2.15,z-9)}else if(n===1){makeBlock(laneX[(laneX.indexOf(safe)+1)%3],z,'crate');for(let i=0;i<5;i++)makeCoin(safe,z-3-i*1.4)}else if(n===2){makeBlock(safe,z,'barrier');makeCoin(laneX[(laneX.indexOf(safe)+1)%3],z-2);makeCoin(laneX[(laneX.indexOf(safe)+1)%3],z-4)}else if(n===3){makeRamp(safe,z);for(let i=0;i<6;i++)makeCoin(safe,z-2-i*1.25)}else if(n===4){makeBlock(laneX[0],z,'crate');makeBlock(laneX[2],z,'crate');makeCoin(0,z-2);makeCoin(0,z-3.5)}else if(n===5){for(let i=0;i<3;i++)makeCoin(laneX[i],z-i*1.2)}else{makeBlock(safe,z,'crate');makeBlock(laneX[(laneX.indexOf(safe)+1)%3],z-5,'barrier');makeCoin(laneX[3-laneX.indexOf(safe)-1]||0,z-2)}nextZ-=19+Math.random()*5}
function toast(t){$('toast').textContent=t;$('toast').style.opacity='1';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.opacity='0',650)}
function updateHud(){$('coins').textContent=coins;$('score').textContent=score}
function reset(){objects.forEach(o=>scene.remove(o.mesh));objects.length=0;lane=1;jumpY=0;jumpV=0;holding=false;buildProgress=0;coins=0;score=0;speed=13;alive=true;gameOver=false;runTime=0;combo=0;nextZ=-24;spawnCount=0;lastAction=0;runner.position.set(0,0,4.2);updateHud();$('hint').textContent='Deslizá para esquivar · saltá o construí';$('overlay').classList.add('hidden');for(let i=0;i<8;i++)spawnPattern()}
function endGame(reason){if(!alive)return;alive=false;gameOver=true;holding=false;$('overlay').classList.remove('hidden');$('overlay').querySelector('h1').innerHTML='¡FIN DE<br>PARTIDA!';$('overlay').querySelector('p').textContent=reason+' Puntaje: '+score+' · Monedas: '+coins+'.';$('start').textContent='VOLVER A JUGAR'}
function moveLane(dir){if(!alive)return;lane=Math.max(0,Math.min(2,lane+dir));runner.position.x=laneX[lane]}
function jump(){if(!alive||jumpY>0.05)return;jumpV=8.8;toast('¡SALTO!')}
function setBuild(v){if(!alive)return;holding=v;$('build').classList.toggle('down',v)}
$('start').addEventListener('click',reset);$('left').addEventListener('pointerdown',e=>{e.preventDefault();moveLane(-1)});$('right').addEventListener('pointerdown',e=>{e.preventDefault();moveLane(1)});$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('build').addEventListener('pointerdown',e=>{e.preventDefault();setBuild(true)});window.addEventListener('pointerup',()=>setBuild(false));window.addEventListener('pointercancel',()=>setBuild(false));
let touchStart=null;renderer.domElement.addEventListener('pointerdown',e=>{if(!alive)return;touchStart={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!touchStart||!alive)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>28){if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);else if(dy<0)jump()}touchStart=null});
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')moveLane(-1);if(e.key==='ArrowRight'||e.key==='d')moveLane(1);if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='Shift')setBuild(true)});window.addEventListener('keyup',e=>{if(e.key==='Shift')setBuild(false)});
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;
if(alive){runTime+=dt;speed=Math.min(23,13+runTime*.16);score+=Math.floor(speed*dt*.45);runner.position.x=THREE.MathUtils.lerp(runner.position.x,laneX[lane],Math.min(1,dt*13));jumpV-=22*dt;jumpY=Math.max(0,jumpY+jumpV*dt);if(jumpY===0)jumpV=0;runner.position.y=jumpY+Math.abs(Math.sin(runTime*speed*.65))*.07;legs[0].rotation.x=Math.sin(runTime*speed*.65)*.65;legs[1].rotation.x=-legs[0].rotation.x;
nextZ+=speed*dt;while(nextZ>-115)spawnPattern();
for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.mesh.position.z+=speed*dt;const dz=Math.abs(o.mesh.position.z-4.2),sameLane=Math.abs(o.mesh.position.x-runner.position.x)<1.15;
if(o.kind==='gap'){if(holding&&dz<12&&dz>2&&o.built<12){o.buildClock=(o.buildClock||0)+dt;while(o.buildClock>.075&&o.built<12){o.buildClock-=.075;o.planks[o.built++].visible=true}}if(dz<1.65&&!o.passed){o.passed=true;if(o.built<12)endGame('Te faltó construir el puente.');else{score+=150;toast('¡PUENTE PERFECTO +150')}}}
if(o.kind==='coin'&&!o.hit&&dz<1.25&&Math.abs(o.mesh.position.x-runner.position.x)<1.05&&Math.abs(o.mesh.position.y-(1.2+jumpY))<1.8){o.hit=true;coins++;score+=25;combo++;toast(combo>4?'¡COMBO x'+combo+'!':'+25');scene.remove(o.mesh)}
if(o.kind==='obstacle'&&!o.hit&&dz<1.15&&sameLane){o.hit=true;if(o.sub==='barrier'&&jumpY>1.05){score+=40;toast('¡BIEN SALTADO!')}else endGame('Chocaste con un obstáculo.');}
if(o.kind==='ramp'&&!o.hit&&dz<1.3&&sameLane){o.hit=true;if(jumpY>.8){score+=100;toast('¡TRUCO +100')}else{jumpV=11;toast('¡IMPULSO!')}}
if(o.mesh.position.z>13||o.hit){scene.remove(o.mesh);objects.splice(i,1)}
}
updateHud();$('hint').textContent='Velocidad '+Math.round(speed)+' · Construí al llegar al hueco';
}
renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
