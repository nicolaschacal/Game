/* GUI de papel recortado: piezas crema, borde de tinta grueso, sombra dura, botones con volumen */
:root{color-scheme:dark;--ink:#1B1730;--cream:#FFF4DC;--paper:#F1E3C2;--gold:#F2B937;--goldD:#C98A1E;--red:#E8452C;--redD:#A92E1B;--green:#5DB84F;--greenD:#3A8A30;--mute:#8a8069;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Nunito,system-ui,sans-serif;color:var(--cream);touch-action:none}
button{font:inherit;color:inherit;padding:0;margin:0;cursor:pointer}

#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 55%,#0000 55%,#1b173066 100%)}

.L{font-family:'Lilita One',Nunito,sans-serif;font-weight:400}
.out{text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink)}
svg.ico{display:block}
/* piezas */
.chip{position:absolute;height:38px;padding:0 14px 0 40px;border-radius:99px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink);font:400 19px/32px 'Lilita One',sans-serif;display:flex;align-items:center}
.chip svg{position:absolute;left:-8px;top:-9px;width:50px;height:50px}
.chip.bump{animation:bump .28s}@keyframes bump{40%{transform:scale(1.22)}}
.round{position:absolute;width:42px;height:42px;border-radius:14px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);color:var(--ink);font:400 20px/34px 'Lilita One',sans-serif;text-align:center}
.round:active,.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:66px;border-radius:20px;border:3.5px solid var(--ink);background:linear-gradient(#FFD46B 0 46%,var(--gold) 46%);box-shadow:0 7px 0 var(--goldD),0 7px 0 3.5px var(--ink),0 14px 18px #0006;color:var(--ink);font:400 27px 'Lilita One',sans-serif;letter-spacing:1.5px;transition:transform .06s,box-shadow .06s}
.btn:before{content:"";position:absolute;left:10px;right:10px;top:5px;height:9px;border-radius:9px;background:#fff7}

.btn.green{background:linear-gradient(#86D66F 0 46%,var(--green) 46%);box-shadow:0 7px 0 var(--greenD),0 7px 0 3.5px var(--ink),0 14px 18px #0006;color:#fff;text-shadow:0 2px 0 var(--greenD)}
.btn.green:active{box-shadow:0 2px 0 var(--greenD),0 2px 0 3.5px var(--ink)}
.btn.sm{height:50px;font-size:18px;border-radius:16px}

.bar{height:9px;border-radius:9px;background:#fff4dc26;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),#FFD46B);transition:width .4s}
/* HUD de carrera */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .25s}

.pop{position:fixed;z-index:8;left:50%;top:50%;font:400 26px 'Lilita One',sans-serif;color:var(--cream);white-space:nowrap;pointer-events:none;animation:pop .85s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink)}
.pop.gold{color:#FFD46B}.pop.pink{color:#FFC4D6;font-size:30px}.pop.big{font-size:40px;color:var(--gold)}
@keyframes pop{0%{transform:translate(-50%,0) scale(.4) rotate(-8deg);opacity:0}18%{transform:translate(-50%,-16px) scale(1.25) rotate(-5deg);opacity:1}30%{transform:translate(-50%,-22px) scale(1) rotate(-5deg)}100%{transform:translate(-50%,-96px) scale(1) rotate(-5deg);opacity:0}}
#banner{position:fixed;z-index:9;top:calc(var(--st) + 190px);opacity:0;pointer-events:none;font-size:24px;padding:8px 30px 9px;max-width:86vw;box-sizing:border-box;text-align:center;line-height:1.05}#banner small{display:block;font-size:12px;letter-spacing:2.5px;opacity:.85;margin-bottom:3px}#banner.long{font-size:20px}
#banner.show{animation:banner 2.2s ease both}@keyframes banner{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
/* Inicio */
#menu{position:fixed;inset:0;z-index:30;display:none}
.logo{position:absolute;left:0;right:0;top:calc(var(--st) + 84px);text-align:center;transform:rotate(-3deg);pointer-events:none;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-3deg) translateY(-6px)}}
.lgsvg{display:block;width:320px;max-width:100%;height:auto;aspect-ratio:320/112;margin:0 auto;overflow:visible;--lgc:inline;--lgp:none}body.gpapel .lgsvg{--lgc:none;--lgp:inline}
.logo .slogan{display:inline-block;margin-top:10px;padding:4px 14px 5px;border-radius:9px;background:var(--ink);border:2.5px solid var(--cream);font:900 11px Nunito;letter-spacing:2.5px;color:var(--cream);box-shadow:0 3px 0 #0006}
.logo .u{position:relative}.logo .u:before{content:'';position:absolute;left:5px;right:5px;top:-6px;height:9px;border-radius:5px;background:var(--cream);box-shadow:0 0 0 3px var(--ink)}
.seal svg{display:block;width:50px;height:50px;margin:2px auto 0}

#mission>b{display:flex;align-items:center;gap:3px;font:900 10.5px Nunito;letter-spacing:.5px;color:#CDC6E6;margin-bottom:2px;line-height:18px}#mission>b em{font:400 14px 'Lilita One',sans-serif;color:var(--gold);font-style:normal;background:#2C2545;border-radius:9px;padding:0 7px;margin-right:4px}
.mrow{display:flex;align-items:center;gap:6px;font:900 11px Nunito;line-height:16px}.mrow svg{width:18px;height:18px;flex:none}.mrow span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrow em{font:400 13px 'Lilita One',sans-serif;color:var(--gold);font-style:normal}.mrow.ok{color:#86D66F}.mrow.ok em{color:#86D66F}
.word{display:inline-flex;align-items:center;gap:3px;margin-left:auto}.word i{display:inline-block;width:15px;height:18px;line-height:18px;text-align:center;border-radius:4px;background:#2C2545;color:#6F6790;font:400 12px 'Lilita One',sans-serif;font-style:normal}.word i.ok{background:var(--cream);color:var(--red)}.word.done i{background:#2F6B3A;color:#86D66F}
.adSim{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#1B1730F2}.adBox{width:min(86%,340px);aspect-ratio:9/13;border-radius:22px;border:3px dashed #7F779F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;color:#CDC6E6}.adBox small{font:900 10px Nunito;letter-spacing:1.2px}.adBox b{font:400 30px 'Lilita One',sans-serif;color:var(--cream)}.adBox p{font:700 12px Nunito;color:#9A93B8;margin:0}.adBox button{margin-top:16px;height:44px;padding:0 20px;border-radius:14px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);font:400 16px 'Lilita One',sans-serif;box-shadow:0 4px 0 var(--ink)}.adBox button:disabled{background:#4A4266;color:#9A93B8;box-shadow:none}

.chestRow{margin-top:12px;padding:10px;border-radius:16px;background:var(--paper);border:2.5px solid var(--ink);display:none;align-items:center;gap:10px;text-align:left}.chestRow svg{width:48px;height:48px;flex:none}.chestRow div{flex:1;min-width:0}.chestRow b{display:block;font:400 15px 'Lilita One',sans-serif;white-space:nowrap}.chestRow small{display:block;font:900 8.5px Nunito;letter-spacing:.4px;color:var(--mute);line-height:1.25}.chestRow .btn{flex:none;height:40px;padding:0 13px;font-size:15px;border-radius:13px;width:auto}

.pk i{background:#2C2545}.pk.best{box-shadow:0 5px 0 var(--ink),0 0 0 3px var(--gold)}.pk.best::after{content:'MEJOR';position:absolute;right:12px;top:-12px;background:var(--gold);border:2.5px solid var(--ink);border-radius:99px;padding:1px 9px;font:900 9px Nunito;letter-spacing:1px}.pk.own .price{background:var(--green);color:#fff}
#tuto{z-index:40}#tuto .card{padding:22px 18px 18px}#tuto .steps{display:flex;justify-content:center;gap:6px;margin-bottom:10px}#tuto .steps i{width:8px;height:8px;border-radius:50%;background:#D9CFB0;border:2px solid var(--ink)}#tuto .steps i.on{background:var(--gold)}
#tuto .pic{height:176px;border-radius:18px;background:linear-gradient(#BFE3F5,#9FD08A);border:3px solid var(--ink);position:relative;overflow:hidden;margin-bottom:12px}

@keyframes handDrag{0%,15%{transform:translate(-50%,0) scale(.85);opacity:0}25%{transform:translate(-50%,0) scale(1);opacity:1}65%{transform:translate(calc(-50% + 70px),-46px) scale(1);opacity:1}80%,100%{transform:translate(calc(-50% + 70px),-46px) scale(.85);opacity:0}}

#tuto h3{margin:0 0 6px;font:400 24px 'Lilita One',sans-serif;color:var(--red)}#tuto p{margin:0 0 14px;font:700 14px/1.4 Nunito;color:var(--ink)}#tuto .no{display:inline-block;background:var(--ink);color:var(--cream);border-radius:8px;padding:1px 7px;font:900 10px Nunito;letter-spacing:1px;margin-bottom:8px}

.pw svg{position:absolute;inset:0;margin:auto;width:38px;height:38px}.pw b{position:absolute;left:5px;right:5px;bottom:-9px;height:6px;border-radius:3px;background:var(--ink)}.pw b i{display:block;height:100%;border-radius:3px;background:#86D66F}

#menu{position:fixed;inset:0;z-index:30;display:none;font-family:Nunito,system-ui,sans-serif}

.head small{position:absolute;left:20px;bottom:48px;font:900 9px Nunito;letter-spacing:1.5px;color:#ffe3b0}
#mapView{position:absolute;left:0;right:0;top:calc(var(--st) + 84px);bottom:0;overflow-x:auto;overflow-y:hidden;touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:none;cursor:grab;background:radial-gradient(circle at 50% 40%,#9CCDE0,#6FA9C3)}
#mapView.zm{overflow-y:auto}#mapView.drag{cursor:grabbing}
#mapPanel .head .chip{display:flex}body.pickstart #mapPanel #mapChip{display:none}#mapPanel .head h2,#mapPanel .head small{right:178px;white-space:nowrap;overflow:hidden}body.pickstart #mapPanel .head h2,body.pickstart #mapPanel .head small{right:18px}
#mapView::-webkit-scrollbar{display:none}
#mapWorld{position:relative;--pk:1}
#mapView.zm #mapWorld{margin-bottom:260px}
.mpin{position:absolute;transform:translate(-50%,-50%) scale(calc(1.2*var(--pk,1)));text-align:center;background:none;border:0;padding:0;color:var(--ink);width:0;height:0}
.mpin .t{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:9px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);transform:rotate(-6deg);display:flex;align-items:center;justify-content:center;font:400 14px 'Lilita One',sans-serif;color:#fff}
.mpin .t svg{width:30px;height:30px}
.mpin .n{position:absolute;left:0;top:19px;transform:translateX(-50%);display:none;padding:2px 8px 3px;border-radius:8px;background:var(--cream);border:2.5px solid var(--ink);font:900 10px Nunito;white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.mpin.done .t{background:var(--green)}.mpin.lock .t{background:#B9AE95;color:#6b6250;font-size:11px}.mpin.lock .n{background:#E6DBC2;color:#6b6250}
.mpin.cur{z-index:3}.mpin.cur .t{background:var(--red);left:-17px;top:-17px;width:34px;height:34px;animation:mbob 1.6s ease-in-out infinite}.mpin.cur .n{display:block;top:23px;background:var(--ink);color:var(--cream);border-color:var(--cream);font-size:11px}
.mpin .stk{position:absolute;left:5px;top:-25px;width:17px;height:17px;border-radius:50%;background:#E14E34;border:2px solid #FFF4DC;box-shadow:0 2px 0 #1B1730;color:#FFF4DC;font:900 10px/13px Nunito;text-align:center;transform:rotate(12deg);pointer-events:none;z-index:2}
.mpin.vis:not(.cur) .t{background:#34437F;color:#F6EBD0}.mpin.vis:not(.cur) .fare{color:#F6EBD0}
.mpin.sel{z-index:4}.mpin.sel .n{display:block}
.mpin.sel .t{outline:4px solid var(--gold);outline-offset:3px}
@keyframes mbob{50%{transform:rotate(-6deg) translateY(-5px)}}
.dcard{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 14px);min-height:160px;border-radius:22px;background:var(--cream);border:3.5px solid var(--ink);box-shadow:0 6px 0 var(--ink);padding:14px 14px 14px 128px;color:var(--ink);z-index:3}
.dcard .th{position:absolute;left:12px;top:12px;bottom:12px;width:102px;border-radius:14px;border:3px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.dcard .th svg{width:118px;height:118px;flex:none;margin-bottom:-6px}
.dcard .k{font:900 9.5px Nunito;letter-spacing:1.4px;color:var(--mute)}.dcard b{display:block;font:400 25px/26px 'Lilita One',sans-serif;margin:3px 0 2px}.dcard .c{font:700 12.5px Nunito;color:#5d5546;margin-bottom:12px}
.dcard .btn{width:100%;height:48px;font-size:19px}
/* Tarjetas: caída, revivir, pausa */
.dim{position:fixed;inset:0;z-index:28;display:none;align-items:center;justify-content:center;background:#1B1730B8}
.card{position:relative;width:min(88%,350px);border-radius:26px;background:var(--cream);border:3.5px solid var(--ink);box-shadow:0 8px 0 var(--ink),0 22px 30px #0007;color:var(--ink);padding:40px 18px 20px;text-align:center;animation:cardIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{0%{transform:scale(.7) translateY(30px);opacity:0}}
.card .ribbon{top:-22px}
.card .lbl{font:900 10px Nunito;letter-spacing:1.6px;color:var(--mute)}.card .big{font:400 58px/56px 'Lilita One',sans-serif}
.card p{margin:4px 0 12px;font:700 12.5px Nunito;color:#5d5546;line-height:1.35}
.rec{display:none;margin-top:6px;padding:3px 12px;border-radius:99px;background:var(--gold);border:2.5px solid var(--ink);font:900 10px Nunito;letter-spacing:1px}
.stats{display:flex;gap:8px;margin:14px 0 4px}.stats div{flex:1;border-radius:14px;background:var(--paper);border:2.5px solid var(--ink);padding:7px 4px 6px;font:400 20px 'Lilita One',sans-serif}.stats small{display:block;font:900 8.5px Nunito;letter-spacing:1px;color:var(--mute)}
.nudge{margin-top:14px;padding:8px 10px 9px 58px;border-radius:14px;background:var(--ink);color:var(--cream);text-align:left;position:relative;font:900 11px Nunito;display:none}.nudge svg{position:absolute;left:4px;top:-12px;width:54px;height:54px}
.row2{display:flex;gap:10px;margin-top:16px}.row2 .btn{flex:1}.row2 .btn+.btn{flex:1.6}
#rvBtn .ring{position:absolute;right:12px;top:8px;width:44px;height:44px;border-radius:50%;background:#ffffff40;overflow:hidden}
#rvBtn .ring:before{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:drain 5s linear forwards}@keyframes drain{to{transform:scaleX(0)}}
#rvBtn .ring span{position:absolute;inset:5px;border-radius:50%;background:var(--green);font:400 21px/34px 'Lilita One',sans-serif;color:#fff}
#rvSub{font:900 10px Nunito;letter-spacing:1px;color:var(--mute);margin-top:14px}
.link{display:block;width:100%;margin-top:12px;padding:8px;background:none;border:0;color:var(--mute);font:900 11px Nunito;letter-spacing:1.2px}
@media(min-width:600px){#menu,.panel,#hud{max-width:480px;left:50%;right:auto;width:100%;transform:translateX(-50%)}}
/* paneles por debajo de la barra inferior (que queda fija y visible), y entrada limpia: fade + slide, sin escala */

@media(max-height:700px){:root{--navH:calc(var(--sb) + 58px)}}
.panel{inset:0 0 var(--navH) 0;z-index:29;padding-bottom:30px;animation:gpPanelIn .22s ease-out}
.panel.pva{animation:gpPanelIn .22s ease-out}
@keyframes gpPanelIn{0%{transform:translateY(14px);opacity:0}}
.pva-det,.pva-cfg{bottom:var(--navH)}
#menu.pnl>:not(#mNav){visibility:hidden}
#menu.pnl{pointer-events:none}#menu.pnl #mNav{pointer-events:auto} /* con un panel abierto, el inicio no intercepta toques; sólo la barra */#menu.pnl:before{display:none}

const MPOOL={coin:{t:n=>t('mission.coin',{n}),base:80,ico:'coin'},prize:{t:n=>t('mission.prize',{n}),base:4,ico:'pearl'},ride:{t:n=>t('mission.ride',{n}),base:3,ico:'boat'},near:{t:n=>t('mission.near',{n}),base:8,ico:'rock'},
 power:{t:n=>t('mission.power',{n}),base:3,ico:'double'},tile:{t:n=>t('mission.tile',{n}),base:200,ico:'tile'},world:{t:n=>t(n>1?'mission.world.many':'mission.world.one',{n}),base:1,ico:'gate'},chest:{t:n=>t(n>1?'mission.chest.many':'mission.chest.one',{n}),base:1,ico:'chest'},streak:{t:n=>t('mission.streak',{n}),base:2,ico:'coin',max:true}};

const pick=a=>a[Math.floor(rnd()*a.length)];
let art=artFor(skinId);
const tiles={},drift={},zone=new Array(ROWS).fill('free'),blockers=[],coins=[],rides=[],vehicles=[];

let cur=START-1,uid=0;

const LIVE={sea:FIN,sky:STORM,rail:CART};
// ── Mecánicas por mundo completado (mundo = DIF.P+1). Una sola tabla para el generador y las tarjetas (MECH_INTRO). ──
// mov = obstáculos móviles · tide = MAREA (mar) · wind = VIENTO (cielo) · rail = DESVÍO (vía). Mundos 1-5 tranquilos.
const MECH={mov:6,tide:20,wind:30,rail:40};
// MODO PRUEBA: todas las mecánicas desde el mundo 1 (para probarlas en el teléfono). MECH_TEST=false para volver a los niveles definitivos
const MECH_TEST=true;
const mechOn=k=>MECH_TEST||DIF.P>=MECH[k]-1,mechFirst=k=>MECH_TEST?DIF.P===0:DIF.P===MECH[k]-1; // first = primer mundo con la mecánica (tramo de aprendizaje)
const movSeen={}; // en modo prueba cada medio tiene al menos un obstáculo móvil
function fill(n,kind,{gap,lead,extra}){
 let safe=2;const air=kind==='sky',lift=air?SKY:0;
 // Monedas en varios caminos: además de la del carril seguro, hay monedas de los costados que se juntan cambiando de carril
 const sideCoins=(lanes,y,lift)=>{const got=[];if(rnd()>.25)return got;const ls=lanes.slice().sort(()=>rnd()-.5).slice(0,rnd()<.5?1:2);for(const x of ls){coins.push({id:'c'+uid++,kind:'paper',svg:COIN,x,y,w:.62,h:.62,value:10,lift,side:true});got.push(x);}return got;};
 for(let i=0;i<n;i++){const y=cur-i;zone[y]=kind;paintRow(y,'empty');
  const coin=x=>coins.push({id:'c'+uid++,kind:'paper',svg:COIN,x,y,w:.62,h:.62,value:10,lift});
  if(i>=lead&&(i-lead)%gap===0&&i<n-1){
   const prev=safe;safe=pick([-2,-1,1,2].map(d=>prev+d).filter(x=>x>=0&&x<COLS));
   const blocked=new Set([prev]),pool=[0,1,2,3,4].filter(x=>x!==safe&&x!==prev);
   for(let k=0;k<extra&&pool.length>1;k++)blocked.add(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
   // Desde MECH.mov algunos obstáculos están vivos: tiburones, nubarrones y gallinas van y vienen entre dos carriles
   // (nunca pisan el carril seguro). Cuanto más avanzado el mundo, más de ellos se mueven.
   let alive=null;if(LIVE[kind]&&mechOn('mov')&&((MECH_TEST&&!movSeen[kind])||rnd()<(S>=3?.6:.38))){alive=[...blocked].map(x=>[x,[x-1,x+1].filter(n=>n>=0&&n<COLS&&n!==safe&&!blocked.has(n))]).find(([x,ns])=>ns.length)||null;if(alive)movSeen[kind]=1;}
   for(const x of blocked){const live=alive&&alive[0]===x,b={id:'b'+uid++,kind:'paper',svg:live?LIVE[kind]:pick(OBST[kind]),x:air?x-.15:x,y:air?y-.15:y,w:air?1.3:1,h:air?1.3:1,lift,cx:x,cy:y};
    if(live)b.mv={a:x,b:pick(alive[1]),period:2.6+rnd()*1.2-S*.12,phase:rnd()*3};
    blockers.push(b);}
   coin(safe);sideCoins(pool,y,lift);
  }else if(i>1){coin(safe);sideCoins([0,1,2,3,4].filter(x=>x!==safe),y,lift);}
 }
 cur-=n;
}
const free=(n,t)=>{for(let i=0;i<n;i++){zone[cur-i]='free';paintRow(cur-i,t);}cur-=n;};
const park=(type,frames,board,size,lift=0)=>{const id='ride'+rides.length;vehicles.push({id,type,kind:'paper',svg:frames.idle[0],frames,fps:type==='boat'?5:6,x:2-(size-1)/2,y:board-(size-1)/2,w:size,h:size,lift});return id;};
// Cada mundo aprieta más: obstáculos más seguidos, más carriles cerrados y tramos más largos
const diff=hard=>({gap:hard||S>=2?2:3,lead:2,extra:hard||S>=1?2:1});
// Deriva: un tramo de ~6 filas con empuje fijo (izq./der.) por tipo de zona: sea = MAREA, sky = VIENTO, rail = DESVÍO (misma regla para los tres).
// Primer mundo con la mecánica: solo en la ruta difícil (en modo prueba, en el primer tramo) y con 4 filas sin rocas; luego, en las dos rutas.
const DRIFT_K={sea:'tide',sky:'wind',rail:'rail'};
const markDrift=(kind,top,len,hard)=>{const m=DRIFT_K[kind],first=mechFirst(m);if(!mechOn(m)||len<11||(first&&(MECH_TEST?hard:!hard)))return;
 const L=first?4:6,d=pick([-1,1]),i0=4+Math.floor(rnd()*(len-11));
 for(let k=0;k<L;k++)drift[top-i0-k]=d;
 if(first){const lo=top-i0-L+1,hi=top-i0+1; // primer tramo de aprendizaje: sin rocas ni obstáculos en el tramo ni en la fila previa
  for(let i=blockers.length-1;i>=0;i--)if(blockers[i].cy>=lo&&blockers[i].cy<=hi)blockers.splice(i,1);}};
const RIDE={
 // Mar: muelle → barco → ruta de agua → playa
 sea(len,hard){free(2,'wood');const board=cur;free(2,'water');const id=park('boat',art.BOAT,board,1.6);const top=cur;fill(len,'sea',diff(hard));markDrift('sea',top,len,hard);const land=cur;free(3,'sand');rides.push({board,land,id,type:'boat'});},
 // Cielo: escalón ya hecho → cima con globo → tiles de cielo → otra cima y bajada
 sky(len,hard){
  for(let k=0;k<LEVELS;k++)free(1,{g:theme.hill,h:k,r:[0,-1]});
  const board=cur;free(2,{g:theme.hill,h:LEVELS});const id=park('balloon',art.BALLOON,board,2,SKY); // el globo espera parado sobre la cima
  const top=cur;fill(len,'sky',diff(hard));markDrift('sky',top,len,hard);
  const land=cur;free(2,{g:theme.hill,h:LEVELS});for(let k=LEVELS-1;k>=0;k--)free(1,{g:theme.hill,h:k,r:[0,1]});
  rides.push({board,land,id,type:'balloon'});},
 // Vías: estación → tren → rieles → estación
 rail(len,hard){const board=cur;free(2,'stone');const id=park('train',art.TRAIN,board,1.6);const top=cur;fill(len,'rail',diff(hard));markDrift('rail',top,len,hard);const land=cur;free(3,'stone');rides.push({board,land,id,type:'train'});},
};
const land=(n,first)=>fill(n,'land',{gap:S>=2?3:4,lead:first?7:3,extra:first?0:S>=3?2:1});
{const order=['sea','sky','rail'];for(let i=0;i<stage%3;i++)order.push(order.shift());
 if(QUICK){land(8,true);order.forEach(k=>{RIDE[k](6,false);land(4);});}
 else{const more=Math.min(S,4);land(12,stage===0);order.forEach((k,i)=>{RIDE[k]((k==='rail'?16:14)+more,false);land(8);});order.forEach((k,i)=>{RIDE[k]((k==='rail'?20:18)+more,true);land(i<2?8:6);});}}
// Power-ups en la pista: algunas monedas se vuelven x2 o escudo; hay un cofre por mundo (casi siempre) y una gema con la próxima letra de la palabra del día.
{const cand=coins.filter(c=>!c.prize&&zone[c.y]!=='free'&&c.y<START-16&&c.y>cur+8);let pool=cand;
 const take=()=>{if(!pool.length)return null;const c=pool[Math.floor(rnd()*pool.length)];pool=pool.filter(x=>Math.abs(x.y-c.y)>=4);return c;};
 const setP=(c,power,svg,size)=>{c.power=power;c.svg=svg;c.w=c.h=size;c.value=0;};
 const nP=3+Math.floor(S/2);for(let i=0;i<nP;i++){const c=take();if(!c)break;const pw=pick(['double','shield','double']);setP(c,pw,{double:DOUBLE,shield:SHIELD}[pw],.95);}
 if(rnd()<.7){const c=take();if(c)setP(c,'chest',CHEST,1.05);}
 {const c=take();if(c)setP(c,'letter',GEM,.9);}} // cámara polaroid: una selfie por ronda
// Meta: siempre un aeropuerto. Pista de asfalto (franjas de cabecera, eje punteado, bordes amarillos con balizas) que sigue hasta el horizonte, con la terminal encima.
const RUNWAY=cur;
for(let i=0;i<=RUNWAY;i++){const y=cur-i;zone[y]='free';for(let x=0;x<COLS;x++){const m=[i===0?'keys':x===2?'center':'',x===0?'L':x===COLS-1?'R':''].filter(Boolean).join('|');tiles[x+','+y]=m?{g:'tarmac',h:0,mark:m}:{g:'tarmac',h:0};}}
cur-=7;const GOAL=cur+2;
const goal={id:'goal',kind:'paper',svg:AIRPORT,x:-.3,y:GOAL-1.1,w:5.6,h:3.36,still:true}; // aeropuerto de siempre, ~12% más grande y quieto
// Tamaño del corredor en la pista (1 = un tile). Para probar otros: ?size=1.7
const PSIZE=+Q.get('size')||1.8;
const player={id:'nilo',kind:'paper',svg:art.HERO.idle[0],frames:art.HERO,fps:art.HERO.runFps||(art.HERO.run.length===6?12:9),x:2,y:START,w:PSIZE,h:PSIZE};
const path={[START]:{x:2,e:2,lanes:{2:1}}};
// Velocidad: sube suave y continua dentro del mundo; cada mundo arranca un poco más rápido y acelera más
const speedAt=prog=>{const p=Math.max(0,Math.min(1,prog));const early=DIF.P===0?.3*(1-p):DIF.P===1?.12*(1-p):0;return Math.min(3.8+Math.min(LAP,3)*.15,1.3+(DIF.P>=1?.22:0)+SP*.13+(.8+S*.09)*Math.pow(p,1.2)+early);};
const runner={fx:theme.id,look:theme.look,landmark:theme.art||null,lmScale:theme.lmScale||1,lmX:theme.lmX||0,playerId:player.id,startRow:START,lane:2,visualLane:2,speed:speedAt(0),distance:0,steps:0,autoAdvance:true,started:false,obstacles:[],coins,path,buildRow:START-1,buildLane:2,lastBuildLane:2,boatId:null,onBoat:false,onCoin,onCoinMiss,onGameOver};
const opts={cols:COLS,rows:ROWS,tiles,drift,zone,items:[player,goal,...vehicles,...blockers,...coins],mode:'placing',preview:false,rain:lluviaAhora,tool:'move',paints:false,valid:null,selected:null,OBJS:{},runner,onTap:()=>{},onCell:()=>{},onMiss:()=>{},onTile:()=>{}};

// ── Sonido: cada tile es una nota, así la carrera suena como una cajita de música que se acelera ──
let ac=null,out=null;
function audio(){if(muted)return null;try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const comp=ac.createDynamicsCompressor();out=ac.createGain();out.gain.value=.9;out.connect(comp).connect(ac.destination);}if(ac.state==='suspended')ac.resume();}catch{}return ac;}
function tone(f,d=.09,type='triangle',v=.05,to=0,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(out);o.start(t);o.stop(t+d+.02);}
let noiseBuf=null;
function noise(d=.1,{f=1200,to=0,q=1,v=.08,type='bandpass',delay=0}={}){const a=audio();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.6,a.sampleRate);const c=noiseBuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
 const t=a.currentTime+delay,s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf;fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(out);s.start(t);s.stop(t+d+.02);}
const PENTA=[0,2,4,7,9],TUNE=[0,1,2,1,3,2,4,2,3,1,2,0,1,2,4,3];let tuneAt=0;
const semi=n=>Math.pow(2,n/12);
const SFX={
 // tile colocado: una nota de la melodía con el timbre del tramo; extra = tile lateral (suena una octava arriba)
 tile(kind,extra){const n=PENTA[TUNE[tuneAt++%TUNE.length]]+(extra?12:0);
  if(kind==='water'){tone(196*semi(n),.11,'sine',.07,392*semi(n));noise(.05,{f:900,v:.02});}

// ── Construcción: el camino avanza solo; tocar o arrastrar cambia de carril ──
// La fila objetivo es siempre la siguiente. Su primer tile entra adelante o en diagonal y, mientras no se llegue
// a su centro, se puede extender a los costados. El tile se elige solo según el tramo. No se construye sobre obstáculos.
const clampLane=l=>Math.max(0,Math.min(COLS-1,Math.round(l)));
const blockSet=new Set(blockers.filter(b=>!b.mv).map(b=>b.cx+','+b.cy));
const movers={};blockers.filter(b=>b.mv).forEach(b=>(movers[b.cy]||=[]).push(b));
const isRockCell=(x,y)=>blockSet.has(x+','+y)||!!movers[y]?.some(m=>Math.round(moverLane(m.mv))===x);
// un obstáculo vivo puede llegar a un tile ya construido: si te alcanza, es choque
function moverHit(){const pos=START-runner.distance,r=Math.round(pos),ms=movers[r];if(!ms||Math.abs(pos-r)>.42)return;
 if(ms.some(m=>Math.abs(moverLane(m.mv)-(runner.visualLane??runner.lane))<.55)){runner.blockedByRock=r;runner.gameOver=true;onGameOver();}}
const targetRow=()=>Math.ceil(START-runner.distance)-1;
const prevExit=y=>runner.path[y+1]?.x??runner.lastBuildLane;
const MAT={land:PATH,sea:'water',sky:'sky',rail:'rail'};
let lastWhoosh=0;
// Vías: cada tile recuerda por dónde entra y por dónde sale el riel, así las curvas y diagonales se pintan solas
const railT={};
const OPP={E:'W',W:'E'},railNew=(x,y,i)=>railT[x+','+y]={g:'rail',h:0,in:i,out:'N'};
// Cambia la salida de un tile. Si ya salía hacia un costado, ese tramo queda como desvío (aguja) en vez de cortarse.
function railOut(x,y,port){const t=railT[x+','+y];if(!t)return;
 if(t.out&&t.out!==port&&OPP[t.out])t.br=[...(t.br||[]),t.out];
 if(t.br)t.br=t.br.filter((p,i,a)=>p!==port&&a.indexOf(p)===i);
 t.out=port;updateRunnerTile(x,y,t);}
// Paso al costado dentro de una fila: de (cx,y) a (nx,y). Volver sobre los pasos deja el tile abandonado como vía muerta con tope.
function railSide(cx,nx,y){const d=nx>cx?'E':'W',c=railT[cx+','+y];
 if(c&&c.in===d){c.out=null;updateRunnerTile(cx,y,c);}else railOut(cx,y,d);
 if(railT[nx+','+y]){railOut(nx,y,'N');return false;}
 railNew(nx,y,OPP[d]);return true;}
function setTile(x,y,extra){const z=zone[y];if(z==='free')return;const g=MAT[z],tile=z==='sky'?{g,h:LEVELS,float:true}:z==='rail'?(railT[x+','+y]||={g,h:0,in:'S',out:'N'}):{g,h:0};tiles[x+','+y]=tile;updateRunnerTile(x,y,tile);addScore(1);missionAdd('tile');SFX.tile(g,extra);}
function moved(){const now=performance.now();if(now-lastWhoosh>90){lastWhoosh=now;SFX.whoosh();buzz(6);}}
let driftFx=null;
// Deriva (marea/viento/desvío): la corriente corre 1 carril el tile recién puesto, salvo borde, roca/obstáculo o si lo desconecta de la fila anterior.
// En vía además se exige que el carril de origen esté libre: así el tile desviado siempre queda con una vía en L bien conectada (si no, no se desvía).
function driftX(x,y,from){const d=drift[y];if(!d||!DRIFT_K[zone[y]])return x;const n=x+d;
 return n<0||n>=COLS||isRockCell(n,y)||Math.abs(n-from)>1||(zone[y]==='rail'&&isRockCell(from,y))?x:n;}
function buildToward(lane){
 if(runner.gameOver)return false;
 const y=targetRow();if(y<0)return false;
 runner.buildRow=y;
 lane=clampLane(lane??runner.buildLane);
 const row=runner.path[y];
 if(!row){
  const from=prevExit(y);
  let x=Math.abs(lane-from)>1?from+Math.sign(lane-from):lane;
  if(isRockCell(x,y)){
   if(x!==from&&!isRockCell(from,y))x=from;
   else{runner.blockedByRock=y;return false;}
  }
  const tx=driftX(x,y,from);if(tx!==x){driftFx=[x,tx-x];x=tx;}
  if(zone[y]==='rail'&&x!==from&&!isRockCell(from,y)){ // vías: cambiar de carril arma dos tiles en la fila (adelante y al costado), así la vía dobla en L sin cortar esquinas
   railNew(from,y,'S');railOut(from,y+1,'N');setTile(from,y,false);
   railSide(from,x,y);setTile(x,y,true);runner.path[y]={x,e:x,lanes:{[from]:1,[x]:1}};
   runner.lastBuildLane=x;runner.steps+=2;moved();return true;
  }
  if(zone[y]==='rail'){
   if(x===from){railNew(x,y,'S');railOut(from,y+1,'N');}
   else if(zone[y+1]==='rail'&&railT[from+','+(y+1)]&&!isRockCell(x,y+1)){ // esquivar con lo de adelante tapado: la vía dobla en la fila anterior (L de dos tiles) y entra derecha, sin cortar esquinas
    if(railSide(from,x,y+1)){const t=railT[x+','+(y+1)];tiles[x+','+(y+1)]=t;updateRunnerTile(x,y+1,t);}
    if(runner.path[y+1])runner.path[y+1].lanes[x]=1;
    railNew(x,y,'S');
   }else{railNew(x,y,x>from?'SW':'SE');railOut(from,y+1,x>from?'NE':'NW');}
  }
  setTile(x,y,false);runner.path[y]={x,e:x,lanes:{[x]:1}};
  runner.lastBuildLane=x;runner.steps++;if(x!==from)moved();
  if(driftFx){driftSwoosh(driftFx[0],y,driftFx[1]);noise(.16,{f:1500,to:450,v:.035});driftFx=null;}
  return true;
 }
 if(lane===row.x)return false;
 if(drift[y]&&Math.sign(lane-row.x)===-drift[y])return false; // contra la corriente no se vuelve atrás: apunta un carril antes
 const nx=row.x+Math.sign(lane-row.x);
 if(isRockCell(nx,y))return false;
 if(zone[y]==='rail')railSide(row.x,nx,y);
 if(!(nx in row.lanes)){setTile(nx,y,true);row.lanes[nx]=1;runner.steps++;}
 row.x=nx;runner.lastBuildLane=nx;moved();
 return true;
}
function refreshHints(){
 const y=targetRow();if(y<0||runner.gameOver||!runner.started||zone[y]==='free'){runner.hints=[];return;}
 const z=zone[y];runner.hintColor=z==='sea'?'#FFFFFF':z==='sky'?'#7FC8FF':'#F2B937';
 const liftOf=x=>z==='sky'&&!tiles[x+','+y]?.float?SKY:0;
 const row=runner.path[y],want=clampLane(runner.buildLane??runner.lastBuildLane),o=[];
 if(!row){const from=prevExit(y);for(const x of [from-1,from,from+1])if(x>=0&&x<COLS&&!isRockCell(x,y)){const hx=driftX(x,y,from);if(!o.some(h=>h.x===hx))o.push({x:hx,y,lift:liftOf(hx),main:x===(Math.abs(want-from)>1?from+Math.sign(want-from):want)});}}
 else for(const x of [row.x-1,row.x+1])if(x>=0&&x<COLS&&!isRockCell(x,y))o.push({x,y,lift:liftOf(x),main:buildHeld&&want!==row.x&&Math.sign(want-row.x)===Math.sign(x-row.x)});
 runner.hints=o;
}
