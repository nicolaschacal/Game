<script type="module">
// Arte del ícono de la app (iOS/Android). Lo usa scripts/iconos/render.py: ?m=icon|fg|bg&s=1024
import {heroFor} from './paper-voyager/elenco.js';
import * as P from './paper-voyager/paper.js';
const q=new URLSearchParams(location.search), mode=q.get('m'), S=+q.get('s')||1024;
const c=document.getElementById('c'); c.style.width=c.style.height=S+'px';
const H=heroFor('nilo','base');
// pose del ícono: 'saludo' = brazo derecho arriba y afuera, bufanda cayendo por detrás; 'juego' = Nilo quieto como en los diálogos
const pose=(s,P)=>s.replace(/<g data-j="(\w+)"([^>]*?)transform="([^"]*)"/g,(m,j,a,t)=>P[j]!=null?`<g data-j="${j}"${a}transform="${P[j]}"`:m);
// cuello de la bufanda con volumen: la vuelta sube a los dos lados de la cara (más a la izquierda), por delante de las orejeras
const CL='M36.2 71 Q31.6 60.5 38 53.2 Q42.6 49.6 48.4 53.4 Q42.6 57.6 44.4 66.6Z', CR='M83.2 70.4 Q87.8 61.4 82 54.6 Q78.4 51.8 73.6 55 Q78.4 58.8 76.6 66.2Z';
const collar=s=>{let n=0;return s.replace(/<g data-j="hwf"/g,m=>{n++;return (n%2? `<path d="${CL}"/><path d="${CR}"/>` :
  `<path d="${CL}" fill="#B8341F" transform="translate(.7 1.1)"/><path d="${CL}" fill="#E8452C"/><path d="M38 53.2 Q42.6 49.6 48.4 53.4 Q44.6 54.6 43.4 57.6 Q39.6 56.6 38 53.2Z" fill="#F26A50"/><path d="M36.2 71 Q31.6 60.5 38 53.2 Q36 61 40.4 69.4Z" fill="#C23C27"/>`+
  `<path d="${CR}" fill="#B8341F" transform="translate(.7 1.1)"/><path d="${CR}" fill="#D9412A"/><path d="M83.2 70.4 Q87.8 61.4 82 54.6 Q84.2 62 80.2 69.2Z" fill="#B8341F"/>`)+m;});};
const SALUDO=collar(pose(H.wave[3],{aU:'translate(79.2 59.97) rotate(-64)',aUf:'translate(0 10.6) rotate(-80)',ht1:'translate(71 60.2) rotate(55)',ht2:'translate(14.6 0) rotate(10)'}));
const JUEGO=H.idle[0];
const POSE=(q.get('pose')||'saludo')==='juego'?JUEGO:SALUDO;
const CABEZA=q.get('pose')==='cabeza'||q.get('pose')==='cabeza2';
// cara de saludo (boca abierta) sin el brazo levantado: el brazo queda abajo, tapado por las nubes
const CARA=H.wave[3].replace(/<g data-j="aU"([^>]*?)>/g,'<g data-j="aU"$1 style="display:none">');
const HEAD=q.get('pose')==='cabeza2'?CARA:JUEGO; // variante: sólo la cabeza asomándose entre las nubes
let cloud=''; try{cloud=P.artThumb('nube');}catch(e){}
const BALL=`<svg viewBox="0 0 160 250" role="img" aria-label="Paper Voyager"><path d="M62 142 L46 190 M98 142 L114 190 M74 144 L66 190 M86 144 L94 190" stroke="#704332" stroke-width="2.6" stroke-linecap="round"/><g transform="translate(-16 0) scale(1.6)"><g stroke="#FFF4DC" stroke-width="5" stroke-linejoin="round"><path d="M60 6 C92 6 104 30 100 50 C97 66 82 76 72 84 L48 84 C38 76 23 66 20 50 C16 30 28 6 60 6Z" fill="#E8452C"/></g><path d="M60 6 C92 6 104 30 100 50 C97 66 82 76 72 84 L48 84 C38 76 23 66 20 50 C16 30 28 6 60 6Z" fill="#E8452C"/><path d="M60 6 C74 22 76 62 68 84 L52 84 C44 62 46 22 60 6Z" fill="#FFF0D2"/><path d="M60 6 C36 14 26 50 40 76 C30 68 22 60 20 50 C16 30 28 6 60 6Z" fill="#B93322" opacity=".55"/><path d="M22 40 Q60 52 98 40 L99 48 Q60 60 21 48Z" fill="#F2B937"/><path d="M48 84 L72 84 L70 90 L50 90Z" fill="#704332"/></g><g class="inl" transform="translate(11 106) scale(1.1)"></g><g stroke="#FFF4DC" stroke-width="7" stroke-linejoin="round"><path d="M43 196 H117 L111 240 Q80 247 49 240Z" fill="#A9794D"/><rect x="38" y="188" width="84" height="12" rx="6" fill="#E2B987"/></g><path d="M43 196 H117 L111 240 Q80 247 49 240Z" fill="#A9794D"/><rect x="38" y="188" width="84" height="12" rx="6" fill="#E2B987"/><path d="M56 202 L58 240 M68 202 L69 242 M80 202 V243 M92 202 L91 242 M104 202 L102 240" stroke="#7A5334" stroke-width="2.4" stroke-linecap="round"/><path d="M47 228 Q80 236 113 228 L111 240 Q80 247 49 240Z" fill="#6B4A2E"/><path d="M46 214 Q80 221 114 214" stroke="#7A5334" stroke-width="2.4" fill="none"/></svg>`;
const balloon=(nilo,w)=>{const d=document.createElement('div');d.innerHTML=BALL;const sv=d.firstElementChild;sv.setAttribute('width',w);sv.setAttribute('height',w*250/160);
  sv.querySelector('.inl').innerHTML=nilo?nilo.replace('<svg','<svg x="0" y="0" width="120" height="120" overflow="visible"'):'';return sv.outerHTML;};
const rays=(cx,cy,n,col)=>{let o='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=a+Math.PI/n;o+=`<path d="M${cx} ${cy}L${cx+2000*Math.cos(a)} ${cy+2000*Math.sin(a)}L${cx+2000*Math.cos(b)} ${cy+2000*Math.sin(b)}Z" fill="${col}"/>`;}return o;};
const BG=`<svg viewBox="0 0 1024 1024" width="${S}" height="${S}" style="position:absolute;inset:0"><defs><radialGradient id="g" cx=".42" cy=".38" r=".8"><stop offset="0" stop-color="#F0654A"/><stop offset=".55" stop-color="#D93A2B"/><stop offset="1" stop-color="#A8261E"/></radialGradient></defs><rect width="1024" height="1024" fill="url(#g)"/><g opacity=".14">${rays(430,400,18,'#FFE2C4')}</g></svg>`;
const k=S/1024, img=(u,x,y,w,op=1)=>u?`<img src="${u}" style="position:absolute;left:${x*k}px;top:${y*k}px;width:${w*k}px;opacity:${op}">`:'';
const nilo=(x,y,w,rot,f)=>`<div style="position:absolute;left:${x*k}px;top:${y*k}px;width:${w*k}px;height:${w*k}px;transform:rotate(${rot}deg)">${f.replace('<svg',`<svg width="${w*k}" height="${w*k}" overflow="visible"`)}</div>`;
const bal=(x,y,w,rot,f)=>`<div style="position:absolute;left:${x*k}px;top:${y*k}px;transform:rotate(${rot}deg);transform-origin:50% 0">${balloon(f,w*k)}</div>`;
const L=JSON.parse(q.get('L')||'{}'); // ajustes de posición sin tocar el archivo
const NX=L.nx??-230, NY=L.ny??150, NW=L.nw??1160, BX=L.bx??610, BY=L.by??30, BW=L.bw??330;
// nubes de papel rojizas, como en el ícono original
const clouds=(y,col,hi)=>{const C=[[-40,70],[120,95],[300,80],[470,100],[640,78],[820,96],[990,80]];return `<svg viewBox="0 0 1024 1024" width="${S}" height="${S}" style="position:absolute;inset:0"><g transform="translate(0 ${y})">${C.map(([x,r])=>`<circle cx="${x}" cy="${r*.2}" r="${r*1.25}" fill="${col}"/>`).join('')}<rect x="-50" y="30" width="1124" height="400" fill="${col}"/>${C.map(([x,r])=>`<path d="M${x-r} ${r*.2-r*.3} A${r*1.25} ${r*1.25} 0 0 1 ${x+r*.6} ${r*.2-r*1.1}" stroke="${hi}" stroke-width="10" fill="none" stroke-linecap="round" opacity=".7"/>`).join('')}</g></svg>`;};
let h='';
if(mode!=='fg') h+=BG;
// la misma escena para iOS y para el frente del ícono adaptativo de Android (ahí va achicada al 66 %, que es lo que se ve en el círculo)
const scene=()=>bal(BX,BY,BW,10,'')+nilo(NX,NY,NW,L.rot??-9,POSE)+[[-240,870],[90,895],[400,870],[720,895]].map(([x,y])=>img(cloud,x,y,620,1)).join('')+[[-120,950],[300,960],[660,950]].map(([x,y])=>img(cloud,x,y,640,1)).join('');
// variante mínima: sólo el gorro, las antiparras y los ojos de Nilo, con aire arriba (fondo: rayos rojos, cielo o papel)
const OJOS=q.get('pose')==='ojos', FONDO=L.fondo||'rojo';
if(OJOS&&mode==='icon'){ if(FONDO!=='rojo') h=`<div style="position:absolute;inset:0;background:${FONDO==='cielo'?'radial-gradient(circle at 40% 30%,#8FD0EE,#4E9CCB)':'radial-gradient(circle at 40% 30%,#FBF1DC,#E9D7B4)'}"></div>`; const K=L.k??18; h+=nilo(512-60*K, (L.top??140)-3*K, 120*K, L.rot??0, JUEGO); }
else if(mode==='icon'){ h+= CABEZA ? bal(L.bx??700,L.by??60,L.bw??240,10,'')+nilo(L.nx??-138,L.ny??130,L.nw??1300,L.rot??-4,HEAD)+[[-240,0],[90,30],[400,0],[720,30]].map(([x,y])=>img(cloud,x,y+(L.cy??700),640,1)).join('')+[[-120,100],[300,120],[660,100]].map(([x,y])=>img(cloud,x,y+(L.cy??700),660,1)).join('') : scene(); }
 // Android adaptativo: las nubes van en el fondo
if(mode==='fg'){ h+=`<div style="position:absolute;inset:0;transform:scale(.667);transform-origin:50% 50%">${scene()}</div>`; h+=[[-60,800],[340,815],[700,800]].map(([x,y])=>img(cloud,x,y,560,1)).join(''); }
c.innerHTML=h; document.title='ok';
</script></body></html>
